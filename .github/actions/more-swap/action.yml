name: More swap
description: >
  Give a Linux runner a larger swapfile. The standard runner has 16 GB of
  RAM; the proof peaks at ~12.3 GiB and the type-check at ~11 GiB, and with
  the runner agent beside them the kernel killed the proof (seen as "The
  runner has received a shutdown signal"). Swap on the runner's disk lets a
  peak spill over instead.
inputs:
  size:
    description: Swapfile size
    default: 16G
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        [ "$RUNNER_OS" = Linux ] || exit 0
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile
        # never take the disk the tests write to: leave 12 GiB free
        want=$(numfmt --from=iec "${{ inputs.size }}")
        free=$(df --output=avail -B1 /mnt | tail -1)
        size=$(( free - 12 * 1024 * 1024 * 1024 ))
        [ "$size" -lt "$want" ] || size=$want
        if [ "$size" -lt $(( 2 * 1024 * 1024 * 1024 )) ]; then
          echo "more-swap: only $(numfmt --to=iec "$free") free on /mnt, no extra swap"; df -h; exit 0
        fi
        echo "more-swap: $(numfmt --to=iec "$size") of swap ($(numfmt --to=iec "$free") free on /mnt)"
        sudo fallocate -l "$size" /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile >/dev/null
        sudo swapon /mnt/swapfile
        free -h
