name: Existing Android APK launch smoke (artifact only)

on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Successful run containing configured-android-release/bootstrap-android
        type: string
        required: true
      source_commit:
        type: string
        required: true
      version:
        type: string
        required: true
      version_code:
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: android-existing-smoke-${{ inputs.producer_run }}
  cancel-in-progress: false

jobs:
  smoke:
    # Standard Intel host: HVF acceleration, no privileged KVM setup or build.
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      EXPECTED_SOURCE: ${{ inputs.source_commit }}
      EXPECTED_VERSION: ${{ inputs.version }}
      EXPECTED_CODE: ${{ inputs.version_code }}
      PRODUCER_RUN: ${{ inputs.producer_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: configured-android-release
          run-id: ${{ inputs.producer_run }}
          github-token: ${{ github.token }}
          path: build/android-existing/input
      - name: Bind the existing APK to its successful producer
        run: python3 scripts/android-existing-smoke.py --preflight
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: python3 scripts/android-existing-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-existing-smoke-${{ inputs.producer_run }}
          path: build/android-existing/evidence/
          if-no-files-found: warn
          retention-days: 14
