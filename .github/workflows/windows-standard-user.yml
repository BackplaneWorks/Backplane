name: Windows standard-user startup
on:
  pull_request:
    paths:
      - 'src/server/effects/storeio.js'
      - 'desktop/**'
      - 'scripts/windows-standard-user-smoke.ps1'
      - '.github/workflows/windows-standard-user.yml'
  workflow_dispatch:
    inputs:
      package_url:
        description: Exact packaged Windows ZIP (HTTPS); blank runs production-effect tests only
        type: string
        default: ''
      package_sha256:
        type: string
        default: ''
      expected_version:
        type: string
        default: '0.14.1'
  workflow_call:
    inputs:
      package_url:
        type: string
        required: true
      package_sha256:
        type: string
        required: true
      expected_version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  regressions:
    if: github.event_name != 'workflow_dispatch' || inputs.package_url == ''
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test desktop/test/store-link.test.cjs desktop/test/service-startup-error.test.cjs desktop/test/startup-recovery.test.cjs desktop/test/load-recovery.test.cjs desktop/test/windows-service-launch.test.cjs desktop/test/service-recovery.test.cjs
  standard-user:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
      - name: Run with a newly created standard user and Developer Mode OFF
        shell: pwsh
        env:
          PACKAGE_URL: ${{ inputs.package_url }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: ./scripts/windows-standard-user-smoke.ps1 -PackageUrl $env:PACKAGE_URL -PackageSHA256 $env:PACKAGE_SHA256 -ExpectedVersion $env:EXPECTED_VERSION
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-standard-user-evidence
          path: |
            build/windows-standard-user/result.json
            build/windows-standard-user/package.json
            build/windows-standard-user/bootstrap.json
            build/windows-standard-user/unit-tests.txt
            build/windows-standard-user/*.png
          if-no-files-found: error
          retention-days: 30
