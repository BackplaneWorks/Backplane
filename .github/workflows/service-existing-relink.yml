name: Relink existing configured service (artifact only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Frozen product commit
        required: true
      target:
        type: choice
        options: [linux-x64, linux-arm64, darwin-arm64, windows-x64]
        required: true
      previous_run:
        description: Accepted configured service producer run
        required: true
      packet_url:
        description: Public source-bound raw emission input packet
        required: true
      packet_sha256:
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: service-relink-${{ inputs.ref }}-${{ inputs.target }}
  cancel-in-progress: false
env:
  BACKPLANE_FROZEN_COMMIT: ${{ inputs.ref }}
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/bootstrap-tools
          persist-credentials: false
      - uses: ./build/bootstrap-tools/.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/download-artifact@v4
        with:
          name: configured-service-${{ inputs.target }}
          run-id: ${{ inputs.previous_run }}
          github-token: ${{ github.token }}
          path: build/previous
      - name: Fetch verified public retained emission inputs
        env:
          PACKET_URL: ${{ inputs.packet_url }}
          PACKET_SHA: ${{ inputs.packet_sha256 }}
        run: |
          python3 build/bootstrap-tools/scripts/release-bootstrap.py fetch --source "$BACKPLANE_FROZEN_COMMIT" --operation js --url "$PACKET_URL" --sha256 "$PACKET_SHA" --directory "$RUNNER_TEMP/release-inputs"
      - name: Transform and link only, reusing accepted helpers
        env:
          TARGET: ${{ inputs.target }}
          BACKPLANE_GOOGLE_BAKE: '1'
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_TELEMETRY_BAKE: '1'
          BACKPLANE_TELEMETRY_URL: https://backplaneworks.com/api/v1/events
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
        run: |
          python3 scripts/local-phase.py --record build/relink.resources.json -- python3 build/bootstrap-tools/scripts/service-relink.py build --checkout "$GITHUB_WORKSPACE" --source "$BACKPLANE_FROZEN_COMMIT" --target "$TARGET" --previous "$GITHUB_WORKSPACE/build/previous" --packet "$RUNNER_TEMP/release-inputs" --out "$GITHUB_WORKSPACE/build/bootstrap-js"
          python3 -c 'import json; r=json.load(open("build/relink.resources.json")); assert r["rc"] == 0 and r["peak_rss_kib"] < 3900*1024, "Compile-only memory budget exceeded"'
          python3 -c 'import json,os,sys; kid=os.environ.get("BACKPLANE_TELEMETRY_KID",""); kid or sys.exit("no telemetry key ID"); json.dump({"schema":1,"version":"0.14.0","channel":"release","baked":True,"capability":"signed-release-events","keyId":kid,"endpoint":os.environ["BACKPLANE_TELEMETRY_URL"],"target":os.environ["TARGET"],"sourceCommit":os.environ["BACKPLANE_FROZEN_COMMIT"]},open("build/bootstrap-js/TELEMETRY-CAPABILITY.json","w"),indent=2)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-service-build-${{ inputs.target }}
          include-hidden-files: true
          path: |
            build/bootstrap-js/
            build/relink.resources.json
          retention-days: 14
  js-runtime:
    needs: js
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-24.04","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-15","windows-x64":"windows-2025"}')[inputs.target] }}
    timeout-minutes: 20
    steps:
      - name: Keep frozen source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/bootstrap-tools
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: configured-service-build-${{ inputs.target }}
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: configured-service-${{ inputs.target }}
          run-id: ${{ inputs.previous_run }}
          github-token: ${{ github.token }}
          path: build/previous
      - name: Launch changed service on matching host and assemble with unchanged ABI
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          exe=backplane-serve; [ "$TARGET" != windows-x64 ] || exe=backplane-serve.exe
          chmod 755 "build/bootstrap-js/$exe"
          "build/bootstrap-js/$exe" --version > build/relink-version.log
          cat build/relink-version.log
          py=python; [ "$RUNNER_OS" != Linux ] || py=/usr/bin/python3
          "$py" build/bootstrap-tools/scripts/service-relink.py component --checkout "$GITHUB_WORKSPACE" --source "$BACKPLANE_FROZEN_COMMIT" --target "$TARGET" --previous "$GITHUB_WORKSPACE/build/previous" --build "$GITHUB_WORKSPACE/build/bootstrap-js" --launch-log "$GITHUB_WORKSPACE/build/relink-version.log" --out "$GITHUB_WORKSPACE/build/bootstrap-service/component"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-service-${{ inputs.target }}
          include-hidden-files: true
          path: |
            build/bootstrap-js/
            build/bootstrap-service/
            build/relink-version.log
            build/relink.resources.json
          retention-days: 14
