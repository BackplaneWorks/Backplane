# The macOS column of docs/e2e/MATRIX.md, on a runner with a logged-in GUI session (the Mac mini is builds only).
# Run by hand only: gh workflow run e2e-macos.yml --ref <branch> [-f jobs=probe|build|rows|all]
name: e2e-macos
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "probe (what the runner allows), hub (macOS hub rows), client (GPUI client rows), pairing (test/e2e/pairing/gpui.sh, hub and client on this runner), kicad-proto (test/kicad_embed/mac/proto: a borderless window in another process kept over a moving window, its lag and stacking; not in all), browser (the embedded Browser and the agent's browser tools, test/cef/agent_proof.py), all"
        default: all
      archive_run:
        description: "release dry run whose darwin-arm64 archive the client rows run from, installed with its install.sh"
        default: "42482640273"
      archive_tag:
        default: "v0.15.0-rc.1"
      pairing_host:
        description: "address the pairing job's hub listens on (empty: the runner's own interface address; 127.0.0.1 to test the loopback refusal)"
        default: ""
      rows:
        description: "client rows to run (space separated, empty: all)"
        default: ""
      kicad_run:
        description: "kicad-pane job: a Backplane_KiCad macOS CI run whose package (backplane-kicad-macos-native) has the macOS embedding"
        default: ""
      kicad_release:
        description: "kicad-pane job: a published Backplane KiCad release (e.g. backplane-kicad-v10.99.0-bp.13.1) whose darwin-arm64 package it runs, instead of kicad_run's"
        default: ""
      mac_mode:
        description: "kicad-pane job: mac_pane_e2e.py's MAC_MODE (empty: the default rows; bs, narrow, restart, lock, autosave, recover, zoom, leave, update, ...)"
        default: ""
      pane_env:
        description: "kicad-pane job: extra environment for the run, space separated NAME=value (e.g. FRONT_REPS=3; mac_mode front also writes the 60 Hz window-order trace into the artifact)"
        default: ""
      bs_probe:
        description: "kicad-pane job with mac_mode bs: BS_PROBE (keys: the edit-keys table; route; order; undo)"
        default: ""
      update_from:
        description: "kicad-pane job with mac_mode update: the Backplane KiCad release the home starts on (e.g. backplane-kicad-v10.99.0-bp.12.5); kicad_run's package is served from a local feed and pinned into this checkout's hub for the run only"
        default: ""
      update_feed:
        description: "kicad-pane job with mac_mode update: local (kicad_run's package served from a local https feed and pinned into this run's hub) or release (the hub's own pin and its download from the published release: nothing injected)"
        default: "local"
      kicad_via:
        description: "kicad-runtime job: curl (fetch and check the tag's package by hand) or driver (Settings > CAD > Install: the hub's own install driver, which needs the hub's MAC pin on that tag)"
        default: "curl"
      kicad_tag:
        description: "kicad-runtime job: the Backplane KiCad release whose darwin-arm64 package it tests (e.g. backplane-kicad-v10.99.0-bp.12.5)"
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: inputs.jobs == 'probe' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: what the runner allows
        run: |
          set +e
          sw_vers; uname -m; id -un; echo "console: $(stat -f%Su /dev/console)"
          system_profiler SPDisplaysDataType | head -30
          mkdir -p out; screencapture -x out/probe.png; ls -l out/probe.png; sips -g pixelWidth -g pixelHeight out/probe.png
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' 
          osascript -e 'tell application "System Events" to keystroke "a"' ; echo "keystroke rc=$?"
          brew list --versions cliclick || brew install cliclick; cliclick p; echo "cliclick rc=$?"
          cliclick m:200,200 w:200 p; echo "cliclick move rc=$?"
          osascript -e 'tell application "Finder" to get bounds of window of desktop'
          python3 -c "import Quartz; print('quartz ok')" 2>&1 | tail -1
          ls /Library/Application\ Support/com.apple.TCC/ 2>&1; sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "select service,client,auth_value from access" 2>&1 | head -20
          node --version; python3 --version; bun --version 2>&1 | head -1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: out }

  kicad-pane:
    # KiCad in the pane on macOS, the whole path: hub and client from this checkout, a Backplane KiCad with embed-macos from a fork CI
    # run (test/kicad_embed/mac_pane_e2e.py). Not in all.
    if: inputs.jobs == 'kicad-pane'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: e2e-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}   # only main writes (branches read main's): the repo's 10 GB cache was evicting the release's (docs/release-retro-0.16.0.md)
      - name: the runtime, from the fork's macOS CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu; mkdir -p "$RUNNER_TEMP/k"
          if [ -n "${{ inputs.kicad_release }}" ]; then
            gh release download "${{ inputs.kicad_release }}" -R BackplaneWorks/Backplane_KiCad -p 'backplane-kicad-darwin-arm64-*[0-9].tar.gz' -D "$RUNNER_TEMP/k"
          else
            gh run download ${{ inputs.kicad_run }} -R BackplaneWorks/Backplane_KiCad -n backplane-kicad-macos-native -D "$RUNNER_TEMP/k"
          fi
          cd "$RUNNER_TEMP/k"; tar xzf backplane-kicad-darwin-arm64-*[0-9].tar.gz
          R=$(ls -d "$RUNNER_TEMP"/k/backplane-kicad-darwin-arm64-*/ | head -1); echo "RT=${R%/}" >> "$GITHUB_ENV"
          python3 -c "import json,sys;m=json.load(open(sys.argv[1]));print(m['version'],len(m['capabilities']),'capabilities')" "$R/manifest.json"; ls "$R/bin"
      - name: the update row's start (update_from) and its feed (kicad_run's package), pinned into this run's hub only
        if: inputs.mac_mode == 'update' && inputs.update_from != '' && inputs.update_feed != 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu; mkdir -p "$RUNNER_TEMP/feed" "$RUNNER_TEMP/from"
          A=$(cd "$RUNNER_TEMP/k" && ls backplane-kicad-darwin-arm64-*[0-9].tar.gz | head -1); cp "$RUNNER_TEMP/k/$A" "$RUNNER_TEMP/feed/"
          (cd "$RUNNER_TEMP/feed" && shasum -a 256 "$A" > SHA256SUMS && cat SHA256SUMS)
          SHA=$(cut -d' ' -f1 "$RUNNER_TEMP/feed/SHA256SUMS"); SIZE=$(stat -f %z "$RUNNER_TEMP/feed/$A"); VER=$(echo "$A" | sed -E 's/.*-(10\.99\.0-bp\.[0-9.]+)\.tar\.gz/\1/')
          python3 - native/host/src/kicad/install.rs "$SHA" "$SIZE" "$VER" "$A" <<'PY'
          import re, sys
          p, sha, size, ver, asset = sys.argv[1:]; s = open(p).read()
          line = f'pub const MAC: Package = Package {{ platform: "darwin-arm64", version: "{ver}", release: "backplane-kicad-v{ver}", asset: "{asset}", sha256: "{sha}", format: "tar.gz", cli: "bin/kicad-cli", size: {size} }};'
          s2 = re.sub(r'^pub const MAC: Package = .*$', lambda m: line, s, count=1, flags=re.M); assert s2 != s; open(p, 'w').write(s2); print('this run pins', ver, sha[:12], size)
          PY
          gh release download ${{ inputs.update_from }} -R BackplaneWorks/Backplane_KiCad -p 'backplane-kicad-darwin-arm64-*.tar.gz' -D "$RUNNER_TEMP/from"
          (cd "$RUNNER_TEMP/from" && tar xzf backplane-kicad-darwin-arm64-*[0-9].tar.gz)
          F=$(ls -d "$RUNNER_TEMP"/from/backplane-kicad-darwin-arm64-*/ | head -1); echo "RT=${F%/}" >> "$GITHUB_ENV"
          # the installer's curl takes https only (--proto =https): the feed on 127.0.0.1 with a throwaway certificate, trusted by that curl alone
          printf '[req]\ndistinguished_name=dn\nx509_extensions=v3\nprompt=no\n[dn]\nCN=127.0.0.1\n[v3]\nsubjectAltName=IP:127.0.0.1\nbasicConstraints=CA:TRUE\n' > "$RUNNER_TEMP/tls.cnf"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -keyout "$RUNNER_TEMP/feed-key.pem" -out "$RUNNER_TEMP/feed-cert.pem" -config "$RUNNER_TEMP/tls.cnf" 2>/dev/null
          (cd "$RUNNER_TEMP/feed" && nohup python3 -c "import http.server,ssl; s=http.server.HTTPServer(('127.0.0.1',8443), http.server.SimpleHTTPRequestHandler); c=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER); c.load_cert_chain('$RUNNER_TEMP/feed-cert.pem','$RUNNER_TEMP/feed-key.pem'); s.socket=c.wrap_socket(s.socket, server_side=True); s.serve_forever()" > "$RUNNER_TEMP/feed.log" 2>&1 &)
          sleep 2; CURL_CA_BUNDLE="$RUNNER_TEMP/feed-cert.pem" curl --proto =https -fsSI https://127.0.0.1:8443/SHA256SUMS | head -1
          echo "BACKPLANE_KICAD_FEED=https://127.0.0.1:8443" >> "$GITHUB_ENV"; echo "CURL_CA_BUNDLE=$RUNNER_TEMP/feed-cert.pem" >> "$GITHUB_ENV"
      - name: the update row's start only (update_from), the hub's own pin and download (update_feed release)
        if: inputs.mac_mode == 'update' && inputs.update_from != '' && inputs.update_feed == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu; mkdir -p "$RUNNER_TEMP/from"; grep -n '^pub const MAC' native/host/src/kicad/install.rs | cut -c1-220
          gh release download ${{ inputs.update_from }} -R BackplaneWorks/Backplane_KiCad -p 'backplane-kicad-darwin-arm64-*[0-9].tar.gz' -D "$RUNNER_TEMP/from"
          (cd "$RUNNER_TEMP/from" && tar xzf backplane-kicad-darwin-arm64-*[0-9].tar.gz)
          F=$(ls -d "$RUNNER_TEMP"/from/backplane-kicad-darwin-arm64-*/ | head -1); echo "RT=${F%/}" >> "$GITHUB_ENV"
      - name: build the hub and the client
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)
          (cd native/host && cargo build --release --bin backplane-hub) & a=$!
          (cd native/gpui && cargo build --release) & b=$!
          wait $a; ra=$?; wait $b; rb=$?; [ $ra = 0 ] && [ $rb = 0 ]
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: KiCad in the pane
        env:
          MAC_MODE: ${{ inputs.mac_mode }}
          BS_PROBE: ${{ inputs.bs_probe }}
        run: |
          set -o pipefail; mkdir -p out
          python -m pip install --quiet pyobjc-framework-Quartz pyobjc-framework-Cocoa
          for kv in ${{ inputs.pane_env }}; do export "$kv"; done
          [ "$MAC_MODE" != front ] || export ZTRACE=1
          python test/kicad_embed/mac_pane_e2e.py "$PWD/native/gpui/target/release/backplane-gpui" "$PWD/native/host/target/release/backplane-hub" "$PWD/assets" "$RT" "$PWD/out/pane" 2>&1 | tee out/pane.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kicad-pane, path: out }

  kicad-runtime:
    # What a Mac gets from a macOS Backplane KiCad release before the MAC pin moves to it: the package fetched and checked as the hub's
    # install does (SHA256SUMS, plain tar, no quarantine, minOs), an agent's kicad_ipc through a hub built from this checkout, Open in KiCad
    # as its own window and the detached-KiCad warning (test/e2e/mac-kicad-runtime.mjs), and checks and exports through its kicad-cli
    # (test/e2e/cad-rows.mjs). Not in all.
    if: inputs.jobs == 'kicad-runtime'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: the release package, fetched and checked as the hub's install does
        if: inputs.kicad_via != 'driver'
        run: |
          set -eu; T=${{ inputs.kicad_tag }}; V=${T#backplane-kicad-v}; A=backplane-kicad-darwin-arm64-$V.tar.gz
          mkdir -p "$RUNNER_TEMP/k" out; cd "$RUNNER_TEMP/k"
          curl -fsSL -o "$A" "https://github.com/BackplaneWorks/Backplane_KiCad/releases/download/$T/$A"
          curl -fsSL -o SHA256SUMS "https://github.com/BackplaneWorks/Backplane_KiCad/releases/download/$T/SHA256SUMS"
          grep -E "  (\./)?$A\$" SHA256SUMS | sed 's#  \./#  #' | shasum -a 256 -c -
          tar xzf "$A"; R="$RUNNER_TEMP/k/backplane-kicad-darwin-arm64-$V"
          echo "quarantine attributes: $(xattr -r "$R" 2>/dev/null | grep -c quarantine || true)"
          python3 -c "import json,sys;m=json.load(open(sys.argv[1]));print('manifest:',m['version'],m['platform'],m.get('minOs'),len(m['capabilities']),'capabilities')" "$R/manifest.json"
          codesign --verify --deep --strict "$R/KiCad.app" && echo "KiCad.app signature verifies"
          ls "$R/bin"; "$R/bin/kicad-cli" --version
          echo "RT=$R" >> "$GITHUB_ENV"; echo "KV=$V" >> "$GITHUB_ENV"
      - name: the hub, built from this checkout
        run: |
          cd native/host && cargo build --profile fast 2>&1 | tail -3
          echo "HUB=$PWD/target/fast/backplane-hub" >> "$GITHUB_ENV"
      - name: Settings > CAD > Install, through the hub's own driver (the pin must be on the tag)
        if: inputs.kicad_via == 'driver'
        run: |
          set -o pipefail; mkdir -p out
          node test/e2e/mac-kicad-install.mjs "$HUB" "$RUNNER_TEMP/ki" 2>&1 | tee out/install.txt
          R=$(grep '^RT=' out/install.txt | tail -1 | cut -d= -f2-); [ -n "$R" ]
          echo "RT=$R" >> "$GITHUB_ENV"; echo "KV=$(basename "$R")" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: agent edits, Open in KiCad, the detached-KiCad warning; checks and exports
        run: |
          set -o pipefail
          python -m pip install --quiet pyobjc-framework-Quartz
          ok=0
          EXPECT_VERSION="$KV" node test/e2e/mac-kicad-runtime.mjs "$HUB" "$RT" 3890 "$RUNNER_TEMP/kr" 2>&1 | tee out/kicad-runtime.txt || ok=1
          KICAD_CLI="$RT/bin/kicad-cli" node test/e2e/cad-rows.mjs "$HUB" "$PWD/out/cad" 3870 2>&1 | tee out/cad-rows.txt || ok=1
          cp "$RUNNER_TEMP"/kr/*.png out/ 2>/dev/null || true; cp "$RUNNER_TEMP"/kr/hub.log out/ 2>/dev/null || true
          exit $ok
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kicad-runtime, path: out, include-hidden-files: true }

  kicad-proto:
    # KiCad in the pane on macOS, option (b) measured before it is built: test/kicad_embed/mac/proto/run.sh
    if: inputs.jobs == 'kicad-proto'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: tracking lag and stacking, timer and display link
        run: |
          sw_vers; system_profiler SPDisplaysDataType | grep -iE "resolution|refresh|display type" | head
          brew list --versions cliclick || brew install cliclick
          sh test/kicad_embed/mac/proto/run.sh "$RUNNER_TEMP/proto"
          python3 test/kicad_embed/mac/proto/analyze.py "$RUNNER_TEMP"/proto/samples.*.csv | tee "$RUNNER_TEMP/proto/summary.txt"
          head -5 "$RUNNER_TEMP"/proto/*.err || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: kicad-proto, path: "${{ runner.temp }}/proto/*.[ctope][sxunr][vtgr]" }

  build:
    if: inputs.jobs == 'build'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: e2e-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}   # only main writes (branches read main's): the repo's 10 GB cache was evicting the release's (docs/release-retro-0.16.0.md)
      - name: build the darwin-arm64 hub and client
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)
          (cd native/host && cargo build --release --bin backplane-hub --bin bp-sh) & a=$!
          (cd native/gpui && cargo build --release) & b=$!
          wait $a; ra=$?; wait $b; rb=$?; [ $ra = 0 ] && [ $rb = 0 ]
          mkdir -p dist; cp native/host/target/release/backplane-hub native/host/target/release/bp-sh native/gpui/target/release/backplane-gpui dist/
          echo "$BACKPLANE_COMMIT" > dist/COMMIT; ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  hub:
    # the macOS hub rows against the hub of the installed release archive
    if: inputs.jobs == 'hub' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: install the release archive with its own installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/e2e/mac-install-archive.sh ${{ inputs.archive_run }} ${{ inputs.archive_tag }}
      - name: FreeCAD and KiCad
        run: |
          brew install --cask freecad || echo "FreeCAD did not install (a download error)"
          brew install --cask kicad || echo "KiCad did not install (a download error)"
      - name: macOS hub rows
        run: |
          set -o pipefail; mkdir -p out
          H="$BUILD/backplane-hub"; echo "hub of the installed archive: $(cat "$BUILD/COMMIT")"
          KICAD_CLI=$(python3 -c 'import os;print(os.path.realpath("/opt/homebrew/bin/kicad-cli"))'); echo "kicad-cli: $KICAD_CLI"; export KICAD_CLI
          FC=/Applications/FreeCAD.app/Contents/Resources/bin/freecadcmd
          ok=0
          node test/e2e/mac-hub-rows.mjs "$H" "$PWD/out/hub-rows" 3801 2>&1 | tee out/hub-rows.txt || ok=1
          node test/e2e/mac-effects.mjs "$H" "$PWD/out/effects" 3860 2>&1 | tee out/effects.txt || ok=1
          node test/e2e/mac-c03.mjs "$H" "$PWD/out/c03" 3840 "$FC" 2>&1 | tee out/c03.txt || ok=1
          node test/e2e/mac-c03-agent.mjs "$H" "$PWD/out/c03-agent" 3850 "$FC" 2>&1 | tee out/c03-agent.txt || ok=1
          node test/e2e/cad-rows.mjs "$H" "$PWD/out/cad" 3870 2>&1 | tee out/cad-rows.txt || ok=1
          node test/e2e/settings-walk.mjs "$H" "$PWD/out/walk" 3830 2>&1 | tee out/walk.txt || ok=1
          exit $ok
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hub-rows, path: out, include-hidden-files: true }

  client:
    if: inputs.jobs == 'client' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the release archive with its own installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/e2e/mac-install-archive.sh ${{ inputs.archive_run }} ${{ inputs.archive_tag }}
      - name: input and screenshot tools, FreeCAD
        run: |
          brew install cliclick
          brew install --cask freecad || echo "FreeCAD did not install (a download error): the Mech viewer row will say so"   # the Mech viewer asks the hub for FreeCAD
          python3 -m venv .venv && .venv/bin/pip install -q pillow pyobjc-framework-Quartz cbor2
      - name: client rows, from the installed archive
        run: |
          set -o pipefail; mkdir -p out
          echo "installed build $(cat "$BUILD/COMMIT") (${{ inputs.archive_tag }}); browser helper: $(ls -l "$BUILD/backplane-browser" 2>&1)"
          BACKPLANE_BROWSER="$BUILD/backplane-browser" .venv/bin/python test/e2e/gpui-f-rows-mac.py "$BUILD/backplane-gpui" "$BUILD/backplane-hub" "$BUILD/assets" "$PWD/out/client" 3891 ${ROWS:-} 2>&1 | tee out/client-rows.txt
        env:
          ROWS: ${{ inputs.rows }}
          RELAY: ${{ contains(inputs.rows, 'F14X') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: client-rows, path: out }

  browser:
    # the embedded Chromium in the installed archive's client: the Browser tab shows the page inside the window and the agent's preview_* tools drive it
    if: inputs.jobs == 'browser' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the release archive with its own installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/e2e/mac-install-archive.sh ${{ inputs.archive_run }} ${{ inputs.archive_tag }}
      - name: the Browser tab and the agent's browser tools
        run: |
          set -o pipefail; mkdir -p out
          echo "installed build $(cat "$BUILD/COMMIT") (${{ inputs.archive_tag }})"; ls "$BUILD"
          python3 test/cef/agent_proof.py "$BUILD/backplane-gpui" "$BUILD/backplane-hub" "$BUILD/backplane-browser" "$BUILD/assets" "$PWD/out/browser" 2>&1 | tee out/browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser, path: out }

  browser-src:
    # the same proof with the client built from this checkout (hub and browser helper from the archive_run's darwin archive): Chromium's log and the
    # helper processes seen while it runs are kept
    if: inputs.jobs == 'browser-src'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpui
          shared-key: e2e-macos-cef
          save-if: ${{ github.ref == 'refs/heads/main' }}   # only main writes (branches read main's): the repo's 10 GB cache was evicting the release's (docs/release-retro-0.16.0.md)
      - name: build the client with cef, its framework and helper apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v ninja >/dev/null || brew install ninja
          (cd native/gpui && cargo build --release --features cef)
          mkdir -p dist; cp native/gpui/target/release/backplane-gpui dist/
          fw=$(find native/gpui/target/release/build -path '*cef-dll-sys*' -type d -name 'Chromium Embedded Framework.framework' -prune | head -1)
          scripts/cef-runtime-files.sh "$(dirname "$fw")" dist macos
          scripts/cef-mac-helpers.sh dist native/gpui/target/release/backplane-cef-helper
          gh run download ${{ inputs.archive_run }} -n archive-darwin-arm64 -D arc && tar -xzf arc/*.tar.gz -C arc
          cp arc/backplane-hub arc/backplane-browser dist/; cp -r assets dist/assets; ls -l dist
      - name: the Browser tab and the agent's browser tools
        run: |
          set -o pipefail; mkdir -p out; B="$PWD/dist"
          (for i in $(seq 1 30); do { date +%T; ps -axo pid,ppid,stat,command | grep -i -E 'backplane|helper' | grep -v grep; } >> out/ps.txt; sleep 4; done) & 
          BACKPLANE_CEF_LOG="$PWD/out/cef.log" python3 test/cef/agent_proof.py "$B/backplane-gpui" "$B/backplane-hub" "$B/backplane-browser" "$B/assets" "$PWD/out/browser" 2>&1 | tee out/browser.txt
      - name: the windowed Browser tab follows the pane, overlays, views and tabs (test/cef/windowed_proof.py)
        if: always()
        run: |
          set -o pipefail; B="$PWD/dist"
          python3 test/cef/windowed_proof.py "$B/backplane-gpui" "$B/backplane-hub" "$B/assets" "$PWD/out/windowed" 2>&1 | tee out/windowed.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-src, path: out }

  client-src:
    # the same client rows, from a build of this checkout (hub, client and the browser helper from source), for a tree newer than the last release archive
    if: inputs.jobs == 'client-src'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: e2e-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}   # only main writes (branches read main's): the repo's 10 GB cache was evicting the release's (docs/release-retro-0.16.0.md)
      - name: build the hub and the client, take the browser helper from the archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)
          (cd native/host && cargo build --release --bin backplane-hub --bin bp-sh) & a=$!
          (cd native/gpui && cargo build --release) & b=$!
          wait $a; ra=$?; wait $b; rb=$?; [ $ra = 0 ] && [ $rb = 0 ]
          mkdir -p dist; cp native/host/target/release/backplane-hub native/gpui/target/release/backplane-gpui dist/
          # the browser helper (tools/browser, a bun program) comes from the release archive: bun's download is not always reachable from a runner
          gh run download ${{ inputs.archive_run }} -n archive-darwin-arm64 -D arc && tar -xzf arc/*.tar.gz -C arc && cp arc/backplane-browser dist/backplane-browser
          cp -r assets dist/assets; echo "$BACKPLANE_COMMIT" > dist/COMMIT; ls -l dist
      - name: input and screenshot tools, FreeCAD
        run: |
          brew install cliclick
          brew install --cask freecad || echo "FreeCAD did not install (a download error): the Mech viewer row will say so"
          python3 -m venv .venv && .venv/bin/pip install -q pillow pyobjc-framework-Quartz cbor2
      - name: client rows, from this checkout's build
        run: |
          set -o pipefail; mkdir -p out; B="$PWD/dist"
          echo "built commit $(cat "$B/COMMIT")"
          printf '#!/bin/sh\nexec "%s" "$@" 2>> "%s/helper.err"\n' "$B/backplane-browser" "$PWD/out" > "$B/bb.sh"; chmod +x "$B/bb.sh"   # the hub drops the helper's stderr; keep it
          BACKPLANE_BROWSER="$B/bb.sh" .venv/bin/python test/e2e/gpui-f-rows-mac.py "$B/backplane-gpui" "$B/backplane-hub" "$B/assets" "$PWD/out/client" 3891 ${ROWS:-} 2>&1 | tee out/client-rows.txt
        env:
          ROWS: ${{ inputs.rows }}
          RELAY: ${{ contains(inputs.rows, 'F14X') && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: client-rows, path: out }

  pairing:
    # the pairing lane's gpui.sh with the hub of the installed archive and the GPUI client on the same runner, over loopback: one machine, no network crossed
    if: inputs.jobs == 'pairing' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install the release archive with its own installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: test/e2e/mac-install-archive.sh ${{ inputs.archive_run }} ${{ inputs.archive_tag }}
      - name: pairing, hub and client on this runner
        env:
          PAIR_HOST: ${{ inputs.pairing_host }}
        run: |
          set -u; mkdir -p out; W="$PWD/pairwork"; mkdir -p "$W/agents"
          for n in claude codex grok muse opencode; do printf '#!/bin/sh\nexit 1\n' > "$W/agents/$n"; chmod +x "$W/agents/$n"; done
          export HUB="$BUILD/backplane-hub" AGENTS="$W/agents"
          echo "installed build $(cat "$BUILD/COMMIT") (${{ inputs.archive_tag }})"
          # a link that names a loopback address is refused for a hub that other machines would reach, so the hub listens on the runner's own interface address (still one machine: nothing crosses a network)
          IP=${PAIR_HOST:-$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || echo 127.0.0.1)}; echo "hub address $IP"
          sh test/e2e/pairing/mac-hub.sh start "$W/hub" 3900 "$IP"
          M="sh $PWD/test/e2e/pairing/mac-hub.sh"
          BASE=http://$IP:3900 TOKEN="$W/hub/token" GPUI="$BUILD/backplane-gpui" WORK="$W" LAUNCH="$PWD/test/e2e/pairing/gpui-start-mac.sh" \
            RESTART="$M restart $W/hub 3900 $IP" EXPIRE="$M expire $W/hub 3900 $IP" \
            sh test/e2e/pairing/gpui.sh 2>&1 | tee out/pairing.txt
          rc=$?; cp -R "$W/logs" out/logs 2>/dev/null; cp "$W/hub.log" out/hub.log 2>/dev/null; exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pairing, path: out }
  pairing-src:
    # the pairing lane's gpui.sh with the hub of the installed archive and the GPUI client on the same runner, over loopback: one machine, no network crossed
    if: inputs.jobs == 'pairing-src'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: e2e-macos
          save-if: ${{ github.ref == 'refs/heads/main' }}   # only main writes (branches read main's): the repo's 10 GB cache was evicting the release's (docs/release-retro-0.16.0.md)
      - name: build the hub and the client from this checkout (no release archive to install)
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)
          (cd native/host && cargo build --release --bin backplane-hub --bin bp-sh) & a=$!
          (cd native/gpui && cargo build --release) & b=$!
          wait $a; ra=$?; wait $b; rb=$?; [ $ra = 0 ] && [ $rb = 0 ]
          mkdir -p dist; cp native/host/target/release/backplane-hub native/gpui/target/release/backplane-gpui dist/; echo "$BACKPLANE_COMMIT" > dist/COMMIT
          echo "BUILD=$PWD/dist" >> "$GITHUB_ENV"
      - name: pairing, hub and client on this runner
        env:
          PAIR_HOST: ${{ inputs.pairing_host }}
        run: |
          set -u; mkdir -p out; W="$PWD/pairwork"; mkdir -p "$W/agents"
          for n in claude codex grok muse opencode; do printf '#!/bin/sh\nexit 1\n' > "$W/agents/$n"; chmod +x "$W/agents/$n"; done
          export HUB="$BUILD/backplane-hub" AGENTS="$W/agents"
          echo "source build $(cat "$BUILD/COMMIT")"
          # a link that names a loopback address is refused for a hub that other machines would reach, so the hub listens on the runner's own interface address (still one machine: nothing crosses a network)
          IP=${PAIR_HOST:-$(ipconfig getifaddr en0 2>/dev/null || ipconfig getifaddr en1 2>/dev/null || echo 127.0.0.1)}; echo "hub address $IP"
          sh test/e2e/pairing/mac-hub.sh start "$W/hub" 3900 "$IP"
          M="sh $PWD/test/e2e/pairing/mac-hub.sh"
          BASE=http://$IP:3900 TOKEN="$W/hub/token" GPUI="$BUILD/backplane-gpui" WORK="$W" LAUNCH="$PWD/test/e2e/pairing/gpui-start-mac.sh" \
            RESTART="$M restart $W/hub 3900 $IP" EXPIRE="$M expire $W/hub 3900 $IP" \
            sh test/e2e/pairing/gpui.sh 2>&1 | tee out/pairing.txt
          rc=$?; cp -R "$W/logs" out/logs 2>/dev/null; cp "$W/hub.log" out/hub.log 2>/dev/null; exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pairing, path: out }
