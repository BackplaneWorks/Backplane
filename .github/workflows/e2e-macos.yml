# The macOS column of docs/e2e/MATRIX.md, on a runner with a logged-in GUI session (the Mac mini is builds only).
# Run by hand only: gh workflow run e2e-macos.yml --ref <branch> [-f jobs=probe|build|rows|all]
name: e2e-macos
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "probe (what the runner allows), hub (macOS hub rows), client (GPUI client rows), all"
        default: all
      rows:
        description: "client rows to run (space separated, empty: all)"
        default: ""
permissions:
  contents: read
jobs:
  probe:
    if: inputs.jobs == 'probe' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: what the runner allows
        run: |
          set +e
          sw_vers; uname -m; id -un; echo "console: $(stat -f%Su /dev/console)"
          system_profiler SPDisplaysDataType | head -30
          mkdir -p out; screencapture -x out/probe.png; ls -l out/probe.png; sips -g pixelWidth -g pixelHeight out/probe.png
          osascript -e 'tell application "System Events" to get name of every process whose background only is false' 
          osascript -e 'tell application "System Events" to keystroke "a"' ; echo "keystroke rc=$?"
          brew list --versions cliclick || brew install cliclick; cliclick p; echo "cliclick rc=$?"
          cliclick m:200,200 w:200 p; echo "cliclick move rc=$?"
          osascript -e 'tell application "Finder" to get bounds of window of desktop'
          python3 -c "import Quartz; print('quartz ok')" 2>&1 | tail -1
          ls /Library/Application\ Support/com.apple.TCC/ 2>&1; sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" "select service,client,auth_value from access" 2>&1 | head -20
          node --version; python3 --version; bun --version 2>&1 | head -1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: out }

  build:
    if: inputs.jobs != 'probe'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: e2e-macos
      - name: build the darwin-arm64 hub and client
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)
          (cd native/host && cargo build --release --bin backplane-hub --bin bp-sh) & a=$!
          (cd native/gpui && cargo build --release) & b=$!
          wait $a; ra=$?; wait $b; rb=$?; [ $ra = 0 ] && [ $rb = 0 ]
          mkdir -p dist; cp native/host/target/release/backplane-hub native/host/target/release/bp-sh native/gpui/target/release/backplane-gpui dist/
          echo "$BACKPLANE_COMMIT" > dist/COMMIT; ls -l dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist }

  hub:
    needs: build
    if: inputs.jobs == 'hub' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: FreeCAD and KiCad
        run: brew install --cask freecad kicad
      - name: macOS hub rows
        run: |
          set -o pipefail
          chmod +x dist/*; mkdir -p out; export HOME_BEFORE=$HOME
          echo "hub commit $(cat dist/COMMIT)"
          ok=0
          node test/e2e/mac-hub-rows.mjs "$PWD/dist/backplane-hub" "$PWD/out/hub-rows" 3801 2>&1 | tee out/hub-rows.txt || ok=1
          FC=/Applications/FreeCAD.app/Contents/Resources/bin/freecadcmd
          node test/e2e/mac-effects.mjs "$PWD/dist/backplane-hub" "$PWD/out/effects" 3860 2>&1 | tee out/effects.txt || ok=1
          node test/e2e/mac-c03.mjs "$PWD/dist/backplane-hub" "$PWD/out/c03" 3840 "$FC" 2>&1 | tee out/c03.txt || ok=1
          node test/e2e/mac-c03-agent.mjs "$PWD/dist/backplane-hub" "$PWD/out/c03-agent" 3850 "$FC" 2>&1 | tee out/c03-agent.txt || ok=1
          KICAD_CLI=/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli node test/e2e/cad-rows.mjs "$PWD/dist/backplane-hub" "$PWD/out/cad" 3870 2>&1 | tee out/cad-rows.txt || ok=1
          node test/e2e/settings-walk.mjs "$PWD/dist/backplane-hub" "$PWD/out/walk" 3830 2>&1 | tee out/walk.txt || ok=1
          exit $ok
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: hub-rows, path: out, include-hidden-files: true }

  client:
    needs: build
    if: inputs.jobs == 'client' || inputs.jobs == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: input and screenshot tools
        run: |
          brew install cliclick
          python3 -m venv .venv && .venv/bin/pip install -q pillow pyobjc-framework-Quartz
      - name: client rows
        run: |
          chmod +x dist/*; mkdir -p out
          echo "client+hub commit $(cat dist/COMMIT)"
          set -o pipefail
          .venv/bin/python test/e2e/gpui-f-rows-mac.py "$PWD/dist/backplane-gpui" "$PWD/dist/backplane-hub" "$PWD/assets" "$PWD/out/client" 3891 ${ROWS:-} 2>&1 | tee out/client-rows.txt
        env:
          ROWS: ${{ inputs.rows }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: client-rows, path: out }
