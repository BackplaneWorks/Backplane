name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.f.outputs.host }}
      gpui: ${{ steps.f.outputs.gpui }}
      browser: ${{ steps.f.outputs.browser }}
      guard: ${{ steps.f.outputs.guard }}
      android: ${{ steps.f.outputs.android }}
      windows: ${{ steps.f.outputs.windows }}
      ios: ${{ steps.f.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            host:
              - 'native/host/**'
              - 'skills/**'
              - 'assets/**'
              - '.github/workflows/ci.yml'
            gpui:
              - 'native/gpui/**'
              - 'assets/**'
              - '.github/workflows/ci.yml'
            browser:
              - 'native/gpui/**'
              - 'test/cef/**'
              - 'scripts/check-linux-archive.sh'
              - '.github/workflows/ci.yml'
            guard:
              - 'native/guard/**'
              - '.github/workflows/ci.yml'
            android:
              - 'mobile/android/**'
              - 'test/mobile/**'
              - 'i18n/**'
              - 'scripts/i18n-android.py'
              - 'scripts/check-android-i18n.py'
              - 'scripts/i18n-check.py'
              - '.github/workflows/ci.yml'
            windows:
              - 'native/**'
              - 'skills/**'
              - 'assets/**'
              - 'test/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'mobile/ios/**'
              - 'scripts/mobile/ios-unit-tests.sh'
              - 'i18n/**'
              - 'scripts/i18n-check.py'
              - 'scripts/i18n-ios.py'
              - 'scripts/check-ios-i18n.py'
              - 'test/mobile/**'
              - 'test/fixtures/voice-edits.json'
              - '.github/workflows/ci.yml'

  # `backplane`, the guard: it has to work where the hub is restarted from, so it runs on all three systems (docs/HUB-RESILIENCE.md).
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is authored and committed by build@amemb.com
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          z=0000000000000000000000000000000000000000
          if [ -n "$BASE" ]; then range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$z" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..HEAD"
          else range="-n 1 HEAD"; fi
          scripts/check-author.sh $range

  guard:
    needs: changes
    if: needs.changes.outputs.guard == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: guard ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/guard
      - name: guard tests
        working-directory: native/guard
        run: cargo test --locked

  # The hub's tests, split over runners with nextest.
  hub:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        partition: [1, 2]
    name: hub ${{ matrix.os }} ${{ matrix.partition }}/2
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/host
          shared-key: hub-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: tests
        working-directory: native/host
        shell: bash
        run: |
          args=(--locked --no-fail-fast --partition count:${{ matrix.partition }}/2)
          # Windows: bp-sh goes beside the test binaries first (the hub runs every sh through it: src/bin/bp-sh.rs), then the filter of what does not hold there
          if [ "$RUNNER_OS" = Windows ]; then cargo build --locked --bin bp-sh; args+=(--retries 1 -E "$(sh ../../scripts/ci-hub-windows-filter.sh)"); fi # one retry: the runner's load flakes (a retried pass shows as FLAKY in the log)
          cargo nextest run "${args[@]}"

  window:
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    name: window ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libwayland-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpui
          shared-key: gpui-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: tests
        working-directory: native/gpui
        shell: bash
        run: |
          cargo nextest run --locked --no-fail-fast

  # The embedded Chromium on Linux (test/cef/lifecycle_e2e.sh): the client built with feature cef, a hub, a private Xvfb with i3 and lavapipe, real X input.
  # An https page and a file:// page load, navigation and back, typing and wheel scrolling, the Browser tab closed and reopened and its page dropped and
  # made again with no CEF helper left over, and quitting leaves none of the helpers it ran. Then a window beside a link to libcef.so only (link_only_e2e.sh).
  browser-linux:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: browser ubuntu-22.04
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - name: system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libwayland-dev libvulkan-dev \
            xvfb i3 mesa-vulkan-drivers libvulkan1 libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon-x11-0 libxtst6 libx11-6 binutils > /dev/null
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: browser-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build
        run: |
          (cd native/host && cargo build --locked --profile fast --bin backplane-hub) & a=$!
          (cd native/gpui && cargo build --locked --profile fast --features cef) & b=$!
          wait $a; ra=$?; wait $b; rb=$?; exit $((ra | rb))
      - name: lifecycle
        run: |
          # the CEF runtime the build put beside the client (the cef crate's distribution): what a dev build and the archive carry
          G=native/gpui/target/fast; for f in libcef.so icudtl.dat resources.pak v8_context_snapshot.bin locales/en-US.pak; do [ -e $G/$f ] || { echo "::error::$f missing beside the client"; exit 1; }; done
          export BACKPLANE_CEF=$PWD/$G E2E_ASSETS=$PWD/assets OUT=$RUNNER_TEMP/cef-life
          sh test/cef/lifecycle_e2e.sh $G/backplane-gpui native/host/target/fast/backplane-hub 2>&1 | grep -v '^GPUI_METRIC' | tee lifecycle.txt; test ${PIPESTATUS[0]} = 0
      - name: link only
        run: BACKPLANE_CEF=$PWD/native/gpui/target/fast sh test/cef/link_only_e2e.sh native/gpui/target/fast/backplane-gpui native/host/target/fast/backplane-hub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-linux
          path: |
            lifecycle.txt
            ${{ runner.temp }}/cef-life/*.log
            ${{ runner.temp }}/cef-life/*.txt
            ${{ runner.temp }}/cef-life/script.json
          retention-days: 5

  # A hub on a temp home and the GPUI client connected to it, on the runner's desktop (WARP, no GPU): test/windows/smoke.sh.
  windows-smoke:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    name: windows smoke
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
          shared-key: windows-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: build
        shell: bash
        run: |
          (cd native/host && cargo build --locked --bin backplane-hub)
          (cd native/gpui && cargo build --locked)
      - name: smoke
        shell: bash
        run: HUB=native/host/target/debug/backplane-hub.exe GPUI=native/gpui/target/debug/backplane-gpui.exe test/windows/smoke.sh

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: catalog and copy checks
        run: python3 scripts/i18n-check.py && python3 scripts/i18n-android.py --check && python3 scripts/check-android-i18n.py
      - name: unit tests and debug build
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  # The phone app: Xcode builds it for the simulator (no signing), then the Swift unit tests (swiftc, no app) run.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: simulator build
        working-directory: mobile/ios
        run: |
          xcodebuild -quiet -project Backplane.xcodeproj -scheme Backplane -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG GPUI_NATIVE DATA_APP" build
      - name: unit tests
        run: scripts/mobile/ios-unit-tests.sh
