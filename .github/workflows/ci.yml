name: CI

# Run by hand only: the pipeline every merge waits on is local CI
# (python3 scripts/local-ci.py, resource-capped local gate). This
# workflow runs once on a release commit before it is published, as the last
# check; the release workflows keep their own (user, 2026-10-22). Nightly
# (nightly.yml) calls it on main every day: the merge gate runs only
# scripts/fast-tests.txt, so this is where the whole suite is held green.
on:
  workflow_dispatch:
    inputs:
      memory_soak:
        description: Run the two-hour isolated hub memory gate
        type: boolean
        default: false
  workflow_call:
    inputs:
      memory_soak:
        description: Run the two-hour isolated hub memory gate
        type: boolean
        default: false

concurrency:
  # github.workflow is the caller's name when called, so a nightly and a
  # hand run on the same ref never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Complete commit history supports merge-base/affected analysis; historical blobs
# stay lazy. js-native keeps its existing sparse working tree.
permissions:
  contents: read

jobs:
  windows:
    name: Release producer guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the service runtime, bootstrap and release asset guards
        run: |
          python3 test/tools/service_runtime_test.py
          python3 test/tools/release_bootstrap_test.py
          python3 test/tools/release_assets_test.py
          python3 test/tools/kicad_library_header_test.py
          python3 test/tools/check_helpers_test.py
          # KiStack: the tracked copy is the pinned one, and builds ship exactly it
          python3 scripts/kistack.py verify
          python3 test/tools/kistack_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Desktop release producer
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/release-producer.test.cjs

  windows-agent-tree:
    name: Windows owned agent tree
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: bun test/tools/process_tree_test.mjs
      - run: bun test/tools/process_tree_native_test.ts

  desktop-install:
    name: Linux desktop installer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - run: |
          python3 test/tools/desktop_install_test.py
          python3 test/tools/classic_installer_test.py
          python3 test/tools/macos_bundle_test.py
      - name: Check test runner dispatch and failure guards
        run: python3 -m unittest discover -s test/tools -p test_runner_test.py

  macos-bundle:
    name: Native macOS bundle integrity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - run: python3 test/tools/macos_bundle_test.py

  check:
    name: Type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup-bend
      - uses: ./.github/actions/more-swap
      - run: CHECK_JOBS=$(nproc) scripts/check.sh check

  proof:
    name: Prove laws
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup-bend
      - uses: ./.github/actions/more-swap
      # The proof reads only PROOF.bend's imports (scripts/bend-closure.py),
      # bend and the gate's scripts. When a run already proved exactly those
      # (any branch, any commit), its record is in the cache and the proof
      # is not run again; any change to them is another key, so it runs.
      - id: key
        run: |
          k=$(BP_KEY_ROOTS=PROOF.bend scripts/inputs-key.sh gate:proof scripts/check.sh scripts/bendok.sh scripts/bend-closure.py scripts/inputs-key.sh) || k=""
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "proof inputs: ${k:-<none: the proof runs>}"
      - id: seen
        if: steps.key.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: .proof-ok
          key: proof-ok-${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.seen.outputs.cache-hit == 'true'
        run: echo "PROOF.bend proved before on these exact inputs (proof-ok-${{ steps.key.outputs.key }})"
      - if: steps.seen.outputs.cache-hit != 'true'
        run: scripts/check.sh proof
      - if: steps.seen.outputs.cache-hit != 'true' && steps.key.outputs.key != ''
        run: echo "${{ steps.key.outputs.key }}" > .proof-ok
      - if: steps.seen.outputs.cache-hit != 'true' && steps.key.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: .proof-ok
          key: proof-ok-${{ steps.key.outputs.key }}

  # Kept as the single gate other jobs depend on; it passes when both
  # halves above pass, so the check and the proof run in parallel on
  # separate runners instead of one after the other in one job.
  laws:
    name: Check and prove
    needs: [check, proof]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "type-check and proof both passed"

  test:
    name: Tests ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}
      TEST_SHARD_COUNT: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: ./.github/actions/more-swap
      # browser fixtures (test/tools/bub_move.mjs) drive the runner's own
      # Chrome through tools/browser's pinned playwright-core
      - name: Browser fixture dependencies
        working-directory: tools/browser
        run: bun install --frozen-lockfile
      # Measured render cases reach 12.3GiB each. test.sh's admission policy
      # currently forces one worker despite the requested two below; the four
      # shards execute on separate machines. Raising concurrency needs capacity
      # qualification, not just extra cores.
      # TEST_FULL: the whole suite, never the merge gate's fast set (which
      # would also run the shard's tests one at a time)
      - run: TEST_FULL=1 TEST_JOBS=2 scripts/test.sh
        env:
          BACKPLANE_CHROME: /usr/bin/google-chrome
          TEST_TIMINGS_OUT: ${{ runner.temp }}/test-timings-${{ matrix.shard }}.txt
      - name: Retain per-test scheduling measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings-${{ matrix.shard }}.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: warn
      - name: JSON surrogate browser contract
        if: matrix.shard == 1
        run: |
          mkdir -p build/ui-laws
          bend test/json_native_test.bend -o build/ui-laws/json_native.mjs
          BACKPLANE_CHROME=/usr/bin/google-chrome bun test/tools/json_surrogate_browser_test.mjs build/ui-laws/json_native.mjs build/ui-laws/browser
      - name: Composer one-button layout contract
        if: matrix.shard == 1
        run: |
          mkdir -p build/composer-bar
          bend test/tools/composer_bar_fixture.bend > build/composer-bar/after.json
          CHROME_BIN=/usr/bin/google-chrome bun test/tools/composer_bar_browser_test.mjs

  # The hub (docs/js-service.md): bend emits src/server/main.bend as JS
  # once (kept by a hash of what it reads, so a change that leaves the
  # server alone takes the last emit), `bun build --compile` cross-builds a
  # single-file backplane-serve for every target from it in seconds, and
  # the Linux one is tested here; js-native runs the others on their own
  # machines. There is no C build of the hub.
  js:
    name: JS service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: SQLite store promotion preserves WAL data
        run: bun test/tools/store_promote_test.cjs
      - id: key
        run: |
          k=$(scripts/build-js.sh --key src/server/main.bend) || k=""
          echo "key=$k" >> "$GITHUB_OUTPUT"
          echo "emit inputs: ${k:-<none: emitted fresh>}"
      # the folder and key scripts/build-js.sh keeps its emit under
      # (BACKPLANE_EMIT_CACHE's default; the file is <key>.js and .js.ok)
      - if: steps.key.outputs.key != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/backplane-bend/emit-js
          # Legacy immutable size-only entries must not shadow verified ones.
          # A corrupt exact hit fails safe; cache repair needs another version.
          key: emit-js-sha256-v1-${{ steps.key.outputs.key }}
      - name: Build backplane-serve for every target
        env:
          # nothing is published here: no Google client, no telemetry
          BACKPLANE_GOOGLE_BAKE: "0"
          BACKPLANE_TELEMETRY_BAKE: "0"
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64; do
            BACKPLANE_JS_TARGET=$t scripts/build-js.sh src/server/main.bend dist-js/$t/backplane-serve
          done
          ls -l dist-js/*/
          # the notices every one ships with, Bun's pinned to its version
          BACKPLANE_LICENSES_STRICT=1 scripts/js-licenses.sh dist-js/licenses
      # the helpers the hub runs, beside it, as a release ships them (issue 510)
      - name: Helpers for every target
        run: |
          for t in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            BACKPLANE_JS_TARGET=$t scripts/build-helpers.sh dist-js/$t
          done
      # the web client the hub serves (test/smoke.ts loads its page)
      - name: Web client
        run: |
          bend src/web/index.html -o build/web > /dev/null
          sh scripts/build-viewer.sh build/web/viewer/vendor
      - name: Secret Save transport and handler coverage
        run: |
          bun test/tools/secret_save_test.mjs
          python3 test/tools/secret_box_handler_test.py
      - name: Secret request in a named-account bot conversation
        env:
          BACKPLANE_CHROME: /usr/bin/google-chrome
        run: |
          (cd tools/browser && bun install --frozen-lockfile)
          bun test/tools/secret_box_e2e.cjs dist-js/linux-x64/backplane-serve build/web
          SECRET_BOX_FAULT=rename bun test/tools/secret_box_e2e.cjs dist-js/linux-x64/backplane-serve build/web
      - run: scripts/js-smoke.sh dist-js/linux-x64/backplane-serve build/web
      # the compiled hub's 4 GiB stack (scripts/js-stack-prelude.js), its
      # children back at 8 MiB
      - name: Hub stack
        run: bun test/tools/js_stack_test.ts dist-js/linux-x64/backplane-serve
      - name: Native hub text and map paths match pure definitions
        env:
          JSON_SHOW_REFERENCE_EMIT: build/js/backplane-serve/all.js
          JSON_PARSE_REFERENCE_EMIT: build/js/backplane-serve/all.js
          MAP_REFERENCE_EMIT: build/js/backplane-serve/all.js
        run: node --test test/tools/js_json_lex_test.cjs test/tools/js_map_test.cjs test/tools/js_parse_memo_test.cjs
      # the host effects and ptys on the loop the hub ships (Bun's event
      # loop): test.sh runs these in-process, on the runtime's sync loop
      - name: Effects on the Bun loop
        run: scripts/js-effects-bun.sh
      - name: Bake and release producer
        run: |
          bun test/tools/js_bake_test.ts
          python3 test/tools/service_release_test.py
          python3 scripts/kicad-library-header.py build/kicad-library-test.js
          bun test/tools/kicad_library_test.ts build/kicad-library-test.js
      - name: KiCad Windows path and installer fixtures
        run: |
          node --test test/tools/sys_exec_guard_test.cjs
          bun test/tools/atomic_text_test.cjs
          python3 test/tools/kicad_cache_test.py
          python3 test/tools/kicad_install_test.py
          python3 test/tools/kicad_discovery_test.py
          python3 test/tools/kicad_open_script_test.py
      # the whole of test/smoke.ts (threads, agents), as scripts/smoke.sh
      # runs it
      - name: Full smoke
        run: |
          bend test/wire/index.html -o build/wire > /dev/null
          BACKPLANE_SMOKE_FULL=1 scripts/js-smoke.sh dist-js/linux-x64/backplane-serve build/web
          bun test/tools/codex_steer_e2e.ts dist-js/linux-x64/backplane-serve build/wire
      # the web client's reconnect pieces, and a view client hearing the
      # hub's heartbeat (and no broadcast) on the built binary
      - name: Reconnect and heartbeat
        run: |
          bun test/tools/reconnect_test.ts
          bun test/tools/thin_heartbeat_e2e.ts dist-js/linux-x64/backplane-serve
      # a touch screen focuses a text field by itself only for a search
      - name: Touch focus
        run: bun test/tools/touch_focus_test.ts
      # the phone bridge's thin rows, request privacy, transport, readiness
      # and flush (hermetic: no hub, build or network)
      - name: Phone bridge
        run: |
          bun test/tools/native_thin_rows_307265.mjs
          bun test/tools/native_thin_privacy_307265.mjs
          bun test/tools/native_thin_bridge_307265.mjs
          bun test/tools/mobile_readiness_test.ts
          bun test/tools/phone_flush_test.ts
      - name: Twenty active threads stay bounded
        timeout-minutes: 3
        run: bun test/tools/active_threads_load.ts --bin dist-js/linux-x64/backplane-serve --out build/active-threads-load.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-threads-load
          path: build/active-threads-load.json
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Hub retention effects and soak negative controls
        run: |
          node test/tools/asset_file_test.mjs
          node --test test/tools/static_file_test.mjs
          node --test test/tools/bounded_cache_test.mjs
          node --test test/tools/hotboot_stream_test.cjs test/tools/wire_log_io_test.cjs test/tools/heap_growth_diagnostics_test.cjs test/tools/perf_gauge_test.cjs test/tools/real_store_policy_test.cjs test/tools/real_store_fence_test.cjs
          bun test/tools/wire_log_bun_test.cjs
          bun test ./test/tools/review_window_test.cjs
          bun test/tools/hub_memory_soak.ts --self-test
      - name: Two-hour isolated hub memory soak
        if: inputs.memory_soak
        timeout-minutes: 135
        run: bun test/tools/hub_memory_soak.ts --bin dist-js/linux-x64/backplane-serve --out build/hub-memory-soak/report.json
      - uses: actions/upload-artifact@v4
        if: always() && inputs.memory_soak
        with:
          name: hub-memory-soak
          path: build/hub-memory-soak/
          if-no-files-found: warn
      # the desktop app's thin client, discovery, reader, mail and search
      # pieces (node --test, headless, under a second)
      - name: Desktop thin and mail tests
        working-directory: desktop
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test test/host-thin-startup.test.cjs test/mail-draft-dispatch.test.cjs test/mail-drafts.test.cjs test/thin-*.test.cjs
      # Native jobs consume one target. The former all-target archive was
      # 802 MiB: every native job downloaded all five platforms.
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js-linux-x64
          path: |
            dist-js/linux-x64/
            dist-js/licenses/
          retention-days: 7
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js-linux-arm64
          path: |
            dist-js/linux-arm64/
            dist-js/licenses/
          retention-days: 7
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js-darwin-x64
          path: |
            dist-js/darwin-x64/
            dist-js/licenses/
          retention-days: 7
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js-darwin-arm64
          path: |
            dist-js/darwin-arm64/
            dist-js/licenses/
          retention-days: 7
          if-no-files-found: error
          compression-level: 1
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-serve-js-windows-x64
          path: |
            dist-js/windows-x64/
            dist-js/licenses/
          retention-days: 7
          if-no-files-found: error
          compression-level: 1

  js-native:
    name: JS service on ${{ matrix.target }}
    needs: js
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-arm64,  os: ubuntu-24.04-arm, gate: true }
          - { target: darwin-arm64, os: macos-15,         gate: true }
          - { target: darwin-x64,   os: macos-15-intel,   gate: true }
          # serves once Bend's JS runtime has Win32 syscalls (fast-hub J4,
          # io_sys); until then it only reports
          - { target: windows-x64,  os: windows-2025,     gate: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.gate }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: |
            scripts
            deploy
            src/server/effects
            src/core
            test/tools
      - uses: oven-sh/setup-bun@v2
        if: matrix.target != 'windows-x64'
        with:
          bun-version: '1.4.3'
      - name: SQLite store promotion on the native platform
        if: matrix.target != 'windows-x64'
        run: bun test/tools/store_promote_test.cjs
      - uses: actions/download-artifact@v4
        with:
          name: backplane-serve-js-${{ matrix.target }}
          path: dist-js
      - uses: oven-sh/setup-bun@v2
        if: matrix.target == 'windows-x64'
        with:
          bun-version: 1.4.3
      - name: Windows stack startup regression
        if: matrix.target == 'windows-x64'
        shell: bash
        run: |
          node --test test/tools/js_stack_prelude_test.cjs test/tools/js_stack_windows_test.cjs
      - shell: bash
        run: |
          f=dist-js/${{ matrix.target }}/backplane-serve
          [ -f "$f" ] || f=$f.exe
          chmod +x "$f"
          scripts/js-smoke.sh "$f"
      - name: The helpers start on their own target
        if: matrix.target != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          d=dist-js/${{ matrix.target }}
          chmod +x $d/backplane-kipc $d/backplane-step2glb $d/backplane-voice $d/backplane-browser
          python3 scripts/check-helpers.py $d --target ${{ matrix.target }} --service-dir
          # each prints its usage: it loaded and ran on this OS and CPU
          usage() { out=$(perl -e 'alarm 20; exec @ARGV' "$@" </dev/null 2>&1) || true; echo "$out" | head -2; echo "$out" | grep -qi usage; }
          usage $d/backplane-voice
          usage $d/backplane-step2glb
          usage $d/backplane-browser --help
          # kipc reads requests on stdin: closed, it ends cleanly
          perl -e 'alarm 20; exec @ARGV' $d/backplane-kipc </dev/null
