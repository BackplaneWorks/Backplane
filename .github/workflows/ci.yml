name: ci
on:
  pull_request:
  push:
    branches: [main, gpui-next]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: hub tests
        run: cd native/host && cargo test --locked -- --skip agents::tests::sigkill_helper
