name: ci
on:
  pull_request:
  push:
    branches: [main, ci-fast]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: short
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      host: ${{ steps.f.outputs.host }}
      gpui: ${{ steps.f.outputs.gpui }}
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            host:
              - 'native/host/**'
              - 'skills/**'
              - 'assets/**'
              - '.github/workflows/ci.yml'
            gpui:
              - 'native/gpui/**'
              - 'assets/**'
              - '.github/workflows/ci.yml'
            android:
              - 'mobile/android/**'
              - '.github/workflows/ci.yml'

  # The hub's tests, split over runners with nextest. Tests that start the real `claude` CLI are left out (scripts/gate-skip.txt).
  hub:
    needs: changes
    if: needs.changes.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        partition: [1, 2]
    name: hub ${{ matrix.os }} ${{ matrix.partition }}/2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/host
          shared-key: hub-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: tests
        working-directory: native/host
        run: |
          skip='test(agents::tests::side_by_side_runs_only_the_persons_turn_with_the_persons_agent_and_guards) | test(agents::tests::sbs_child_probe)'
          # macOS: /var is /private/var, so two opencode path assertions differ (a test bug, not the hub)
          if [ "$RUNNER_OS" = macOS ]; then skip="$skip | test(/opencode_(turn_matches_the_js_hub|resumes_without_replay)/)"; fi
          cargo nextest run --locked --partition count:${{ matrix.partition }}/2 -E "not ($skip)"

  window:
    needs: changes
    if: needs.changes.outputs.gpui == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: window ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libwayland-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/gpui
          shared-key: gpui-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@nextest
      - name: tests
        working-directory: native/gpui
        run: |
          # macOS: the keymap tests assume Linux's ctrl chords (secondary is cmd there)
          if [ "$RUNNER_OS" = macOS ]; then cargo nextest run --locked -E 'not test(/^keys::tests::/)'; else cargo nextest run --locked; fi

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: debug build
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
