name: Release native runtime recovery (existing binaries only)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Frozen product commit
        required: true
        type: string
      build_run:
        description: Existing configured service build run; no compilation
        required: true
        type: string
      targets:
        description: Native runtime matrix include rows
        required: true
        type: string
      windows_runtime_url:
        required: false
        default: ''
        type: string
      windows_runtime_sha256:
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: runtime-recovery-${{ inputs.ref }}-${{ inputs.build_run }}-${{ inputs.targets }}
  cancel-in-progress: false
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve frozen source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          name: configured-service-build-${{ matrix.target }}
          path: build
      - name: Restore only omitted public plugin metadata and verify pinned KiStack
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util,pathlib,json,hashlib
          root=pathlib.Path.cwd(); raw=root/'build/bootstrap-js'
          spec=importlib.util.spec_from_file_location('ki',root/'scripts/kistack.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          f=raw/'kistack/.claude-plugin/plugin.json'
          if not f.exists():
              f.parent.mkdir(parents=True,exist_ok=True);f.write_text(m.MANIFEST)
          pin=m.check(raw/'kistack',root)
          b=json.loads((raw/'BUILD.json').read_text());binary=raw/b['service']
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==b['binary_sha256']
          binary.chmod(0o755)
          for name in b['helpers']:(raw/name).chmod(0o755)
          (raw/'METADATA-REPAIR.json').write_text(json.dumps({'restoredOnly':'kistack/.claude-plugin/plugin.json','sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'fullKiStackCheck':pin,'binaryUnchanged':True},indent=2))
          PY
      - name: Measure actual matching host and assemble component without compiler
        shell: bash
        env:
          WINRT_URL: ${{ inputs.windows_runtime_url }}
          WINRT_SHA: ${{ inputs.windows_runtime_sha256 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          set --
          if [ "$TARGET" = windows-x64 ]; then
            curl --proto '=https' --tlsv1.2 -fsSL "$WINRT_URL" -o "$RUNNER_TEMP/winrt.tar.gz"
            echo "$WINRT_SHA  $RUNNER_TEMP/winrt.tar.gz" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/winrt"; (cd "$RUNNER_TEMP" && tar -xzf winrt.tar.gz -C winrt)
            set -- --windows-runtime "$RUNNER_TEMP/winrt"
          fi
          py=python; [ "$RUNNER_OS" != Linux ] || py=/usr/bin/python3
          "$py" scripts/service-runtime.py "$@" --source-root "$GITHUB_WORKSPACE" --build "$GITHUB_WORKSPACE/build/bootstrap-js" --producer "$GITHUB_WORKSPACE/scripts/service-release.py" --producer-sha256 ae60a25ad3f42a6b906b5deae2cfc0b6be2a65863172c64a3b69b207b0b6fef2 --out "$GITHUB_WORKSPACE/build/bootstrap-service"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-recovered-${{ matrix.target }}
          include-hidden-files: true
          path: |
            build/bootstrap-service/
            build/bootstrap-js/METADATA-REPAIR.json
            build/bootstrap-js/TELEMETRY-CAPABILITY.json
          if-no-files-found: warn
          retention-days: 14
