name: KiCad Flatpak integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/kicad-flatpak.sh
      - test/tools/kicad_flatpak_test.py
      - test/fixtures/flatpak/minimal.kicad_pcb
      - .github/workflows/kicad-flatpak.yml
permissions:
  contents: read
jobs:
  export:
    name: Export using the stock KiCad Flatpak
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y flatpak dbus-x11
      - name: Install and export through the adapter
        run: |
          dbus-run-session -- sh -eu <<'SH'
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive --no-related flathub org.kicad.KiCad
          scripts/kicad-flatpak.sh version
          scratch=$(mktemp -d '/tmp/bp flatpak.XXXXXX')
          trap 'rm -rf "$scratch"' EXIT
          cp test/fixtures/flatpak/minimal.kicad_pcb "$scratch/test board.kicad_pcb"
          scripts/kicad-flatpak.sh pcb export svg -o "$scratch/out dir" "$scratch/test board.kicad_pcb"
          find "$scratch/out dir" -name '*.svg' | grep -q .
          SH
