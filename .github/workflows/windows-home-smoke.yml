name: Native Windows HOME smoke

# One isolated environment handoff. No service build, hub, login or package.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-home-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  home:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Pass missing HOME into a real native Bun child
        run: node desktop/test/windows-home-native-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-home-smoke
          path: build/windows-home-native-smoke/result.json
          if-no-files-found: error
          retention-days: 7
