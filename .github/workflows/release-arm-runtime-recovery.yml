name: Recover configured ARM service runtime component (artifact only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-arm-runtime-recovery-8147b68d
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8147b68dbc9bcddad7e3b51ae7768ed9eb211ecc
          persist-credentials: false
      - name: Check out trusted measurement tools separately
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/recovery-tools
          persist-credentials: false
      - name: Download original configured native artifact without recompilation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/i2cjak/Backplane/actions/artifacts/12357277029/zip > "$RUNNER_TEMP/original-native.zip"
          printf '%s  %s\n' 5f4b30a56061b5c00a258a8d2f8800bfc6547e2d40967b42d1474f8b54ac20d9 "$RUNNER_TEMP/original-native.zip" | sha256sum -c -
      - name: Measure matching-host ABI and assemble the saved native service
        shell: bash
        run: |
          python3 build/recovery-tools/scripts/release-arm-runtime-recovery.py --source-root "$GITHUB_WORKSPACE" --archive "$RUNNER_TEMP/original-native.zip" --runtime-producer "$GITHUB_WORKSPACE/build/recovery-tools/scripts/service-runtime.py" --runtime-sha256 fb6d086233407a523f4b960ff13b46a5e2df461208c110db3c700fa688a9967d --out "$GITHUB_WORKSPACE/build/native-arm-recovery"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-service-linux-arm64-recovered
          path: |
            build/native-arm-recovery/bootstrap-service/
            build/native-arm-recovery/RECOVERY.json
          if-no-files-found: warn
          retention-days: 14
