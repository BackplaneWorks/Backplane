name: Private real-store startup and memory
# The real owner store must never be uploaded to a GitHub-hosted runner or
# artifact. An owner-controlled SMALL runner pre-stages immutable inputs in
# BACKPLANE_QUALIFIED_HUB, BACKPLANE_QUALIFIED_HUB_SHA256 and
# BACKPLANE_PRIVATE_REAL_STORE. No build, install, telemetry or publication.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-real-store
  cancel-in-progress: false
jobs:
  real-store:
    runs-on: [self-hosted, linux, x64, backplane-private-small]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Owned real-store startup and 30 minute unforced RSS gate
        run: sh scripts/real-store-ci.sh
      # The runner's private result contains only hashes/counts/measurements.
      # Do not upload artifacts here: the owner keeps the receipt privately.
