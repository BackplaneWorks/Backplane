name: Windows build

on:
  workflow_dispatch:
    inputs:
      telemetry_url:
        description: Approved endpoint for the frozen candidate native compile
        type: string
        default: https://backplane.works/api/v1/events
      ref:
        description: Full frozen source commit (40 hex characters)
        type: string
        required: true
      version:
        description: Full package version, e.g. v0.11.2
        type: string
        required: true
        default: v0.11.2
  workflow_call:
    inputs:
      telemetry_url:
        description: Approved endpoint for the frozen candidate native compile
        type: string
        default: https://backplane.works/api/v1/events
      ref:
        description: Source ref (the caller's commit when empty)
        type: string
        default: ''
      version:
        description: Release version (a CI commit label when empty)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  emit:
    name: Emit windows-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    env:
      BACKPLANE_VERSION: ${{ inputs.version }}
      BUN_JSC_forceRAMSize: '4294967296'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate standalone release dispatch
        if: github.event_name == 'workflow_dispatch' && contains(github.workflow_ref, '/.github/workflows/windows.yml@')
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.version }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'CHECK'
          import os, re, runpy, subprocess
          commit, tag = os.environ['SOURCE_COMMIT'], os.environ['RELEASE_TAG']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('dispatch requires a full frozen commit')
          runpy.run_path('scripts/release-assets.py')['identity'](commit, tag)
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != commit or os.environ['WORKFLOW_COMMIT'] != commit:
              raise SystemExit('workflow and checkout must match the frozen source')
          CHECK
      - name: Freeze source commit for native checkout
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - run: scripts/emit-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-emitted
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
          path: |
            build/windows-emitted/
            build/windows-helpers/
            dist/web/

  build:
    name: Build and test windows-x64
    needs: [emit]
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      BACKPLANE_VERSION: ${{ inputs.version }}
      BACKPLANE_JOBS: '2'
      BACKPLANE_CYGWIN_ROOT: ${{ github.workspace }}\..\backplane-cygwin
    steps:
      - name: Keep shell sources as LF
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.emit.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-emitted
          path: .
      - name: Install native Cygwin compiler and runtime
        shell: pwsh
        run: ./scripts/setup-windows.ps1 -Root $env:BACKPLANE_CYGWIN_ROOT -BuildTools
      - name: Install real Windows provider CLIs (no login)
        shell: pwsh
        run: ./scripts/install-windows-providers.ps1
      - name: Compile, native smoke tests and Windows package
        env:
          BACKPLANE_GOOGLE_BAKE: "1"
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_RELEASE_SOURCE: ${{ needs.emit.outputs.commit }}
          BACKPLANE_TELEMETRY_BAKE: ${{ inputs.version != '' && '1' || '0' }}
          BACKPLANE_TELEMETRY_URL: ${{ inputs.telemetry_url }}
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
        shell: pwsh
        run: |
          $bin = Join-Path $env:BACKPLANE_CYGWIN_ROOT 'bin'
          $env:PATH = $bin + ';' + $env:PATH
          if ($env:BACKPLANE_TELEMETRY_BAKE -eq '1') {
            $bake = & (Join-Path $bin 'cygpath.exe') -u "$env:GITHUB_WORKSPACE/scripts/release-assets.py"
            if ($LASTEXITCODE -ne 0) { throw 'Bake check path conversion failed' }
            & (Join-Path $bin 'bash.exe') --login -c 'python3 "$1" check-bake --source "$2" --tag "$3"' -- $bake $env:BACKPLANE_RELEASE_SOURCE $env:BACKPLANE_VERSION
            if ($LASTEXITCODE -ne 0) { throw 'Release bake input check failed' }
          }
          $script = & (Join-Path $bin 'cygpath.exe') -u "$env:GITHUB_WORKSPACE/scripts/ci-windows.sh"
          if ($LASTEXITCODE -ne 0) { throw 'Cygwin path conversion failed' }
          & (Join-Path $bin 'bash.exe') --login $script
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/backplane-*-windows-x64.zip
            dist/backplane-*-windows-x64.zip.sha256
