name: Windows OMP standard-user RPC
on:
  pull_request:
    paths:
      - 'src/server/omp-launch.bend'
      - 'src/server/effects/omp-launch.js'
      - 'src/server/effects/host.js'
      - 'src/server/effects/loop.js'
      - 'src/server/server.bend'
      - 'test/tools/omp*'
      - 'test/omp_launch_test.bend'
      - 'scripts/windows-omp-smoke.ps1'
      - '.github/workflows/windows-omp-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-omp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  omp:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Real OMP RPC under a standard account, Developer Mode OFF
        shell: pwsh
        run: ./scripts/windows-omp-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-omp-standard-user
          path: |
            build/windows-omp/result.json
            build/windows-omp/bootstrap.json
            build/windows-omp/prompt-received.json
          if-no-files-found: error
          retention-days: 30
