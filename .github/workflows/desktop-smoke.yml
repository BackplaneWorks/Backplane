name: Windows0.12.2 icon resource generation only
on:
  workflow_dispatch:
    inputs:
      input_url: {type: string, required: true}
      input_sha256: {type: string, required: true}
      product_commit: {type: string, required: true}
permissions: {contents: read}
concurrency:
  group: windows-brand-${{ inputs.input_sha256 }}
  cancel-in-progress: false
jobs:
  brand:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      INPUT_URL: ${{ inputs.input_url }}
      INPUT_SHA: ${{ inputs.input_sha256 }}
      PRODUCT_COMMIT: ${{ inputs.product_commit }}
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Fetch exact executable and apply native icon resources
        shell: python
        run: |
          from pathlib import Path
          import os,hashlib,json,urllib.request,zipfile,subprocess,sys,time
          started=time.monotonic()
          assert os.environ['PRODUCT_COMMIT']=='5fb5c082a1876228bb3e108cd2bc391be84be936'
          archive=Path('inputs.zip')
          with urllib.request.urlopen(os.environ['INPUT_URL'],timeout=300) as src, archive.open('wb') as dst:
              while block:=src.read(1048576):dst.write(block)
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(archive)==os.environ['INPUT_SHA']
          with zipfile.ZipFile(archive) as z:
              assert set(z.namelist())=={'Backplane.exe','brand-windows.py','backplane.ico'}
              z.extractall('inputs')
          exe=Path('inputs/Backplane.exe'); original=digest(exe)
          subprocess.run([sys.executable,'inputs/brand-windows.py',str(exe),'inputs/backplane.ico'],check=True)
          out=Path('branded');out.mkdir();exe.rename(out/'Backplane.exe')
          receipt={'status':'GENERATED_NATIVE_WINDOWS_ICON_RESOURCES','version':'0.12.2','sourceCommit':os.environ['PRODUCT_COMMIT'],
                   'inputArchiveSha256':os.environ['INPUT_SHA'],'originalExecutableSha256':original,'brandedExecutableSha256':digest(out/'Backplane.exe'),
                   'iconSha256':digest(Path('inputs/backplane.ico')),'helperSha256':digest(Path('inputs/brand-windows.py')),
                   'signed':False,'runtimeAcceptance':'USER_WAIVED_NOT_PASS','seconds':time.monotonic()-started}
          (out/'WINDOWS-BRANDING.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt))
      - uses: actions/upload-artifact@v4
        with:
          name: branded-windows-0122
          path: branded/
          if-no-files-found: error
          retention-days: 14
