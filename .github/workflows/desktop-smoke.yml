name: Frozen 0.13 desktop packaging (no compiler or administrator commands)
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [linux-x64, linux-arm64, darwin-arm64, windows-x64]
        required: true
      stage_url:
        required: true
        type: string
      stage_sha256:
        required: true
        type: string
      tools_url:
        required: true
        type: string
      tools_sha256:
        required: true
        type: string
      smoke_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: frozen013-package-${{ inputs.target }}-${{ inputs.stage_sha256 }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ${{ inputs.target == 'linux-x64' && 'ubuntu-22.04' || inputs.target == 'linux-arm64' && 'ubuntu-22.04-arm' || inputs.target == 'windows-x64' && 'windows-2025' || 'macos-15' }}
    timeout-minutes: 12
    env:
      STAGE_URL: ${{ inputs.stage_url }}
      STAGE_SHA: ${{ inputs.stage_sha256 }}
      TOOLS_URL: ${{ inputs.tools_url }}
      TOOLS_SHA: ${{ inputs.tools_sha256 }}
      SMOKE_SHA: ${{ inputs.smoke_sha256 }}
      TARGET: ${{ inputs.target }}
      BACKPLANE_TELEMETRY: 'off'
      BACKPLANE_DESKTOP_BROWSER: '1'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable supplied stage and current source tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir package
          cd package
          python - <<'PY'
          import urllib.request,hashlib,tarfile,os,pathlib
          for name in ['STAGE','TOOLS']:
              u=os.environ[name+'_URL'];h=os.environ[name+'_SHA'];assert u.startswith('https://') and len(h)==64
              p=pathlib.Path(name.lower()+'.tar.gz')
              with urllib.request.urlopen(u,timeout=90) as response,p.open('wb') as f:
                  while b:=response.read(1024*1024):f.write(b)
              with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==h
              with tarfile.open(p) as tar:tar.extractall(filter='fully_trusted')
          p=pathlib.Path('tools/desktop/test/release-smoke.cjs');assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['SMOKE_SHA']
          PY
          (cd tools/desktop && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Actual bounded desktop smoke with OS sandbox enabled
        shell: bash
        run: |
          set -euo pipefail
          cd package
          if [[ $TARGET == linux-* ]]; then
            unshare --user --map-root-user /bin/true
            command -v xvfb-run
            xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' timeout --signal=TERM --kill-after=10s 180s node tools/desktop/test/release-smoke.cjs --stage "$PWD/stage" --out "$PWD/evidence"
          else
            node tools/desktop/test/release-smoke.cjs --stage "$PWD/stage" --out "$PWD/evidence"
          fi
      - name: Strict source-bound ordinary archive after actual smoke
        shell: bash
        run: |
          set -euo pipefail
          cd package
          node tools/desktop/archive-after-smoke.cjs --stage "$PWD/stage" --evidence "$PWD/evidence" --out "$PWD/acceptance" --dist "$PWD/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-desktop-${{ inputs.target }}
          path: |
            package/evidence/
            package/acceptance/
            package/dist/*.tar.gz
            package/dist/*.zip
            package/dist/*.sha256
            package/dist/**/DESKTOP.json
            package/dist/**/MANIFEST.json
          retention-days: 14
