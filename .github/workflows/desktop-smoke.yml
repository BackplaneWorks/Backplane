name: Frozen 0.13.1 affected native packaging only
on:
  workflow_dispatch:
    inputs:
      source_commit: {type: string, required: true}
      build_run: {type: string, required: true}
      components_url: {type: string, required: true}
      components_sha256: {type: string, required: true}
permissions:
  contents: read
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: darwin-arm64, runner: macos-15}
          - {target: windows-x64, runner: windows-2025}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    env:
      BACKPLANE_FROZEN_COMMIT: ${{ inputs.source_commit }}
      TARGET: ${{ matrix.target }}
      COMPONENTS_URL: ${{ inputs.components_url }}
      COMPONENTS_SHA: ${{ inputs.components_sha256 }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BACKPLANE_TELEMETRY: 'off'
      BACKPLANE_DESKTOP_BROWSER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve committed product bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/packaging-tools
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: configured-service-${{ matrix.target }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: build/native-input
      - name: Install cached dependencies using actual native shell npm
        run: npm --prefix desktop ci --ignore-scripts --no-audit --no-fund
      - name: Restore verified component modes, stage and run existing smoke/archive
        run: python build/packaging-tools/scripts/release-0131-native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-desktop-${{ matrix.target }}
          path: |
            build/release-0131/evidence-ascii/
            build/release-0131/evidence/
            build/release-0131/acceptance/
            build/release-0131/dist/*.tar.gz
            build/release-0131/dist/*.zip
            build/release-0131/dist/*.sha256
            build/release-0131/dist/**/DESKTOP.json
            build/release-0131/dist/**/MANIFEST.json
            build/release-0131/RESULT.json
          retention-days: 14
