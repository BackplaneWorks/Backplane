name: Existing Windows desktop component packaging (artifact only)

on:
  workflow_dispatch:
    inputs:
      product_commit:
        type: string
        required: true
      product_tree:
        type: string
        required: true
      packet_url:
        type: string
        required: true
      packet_sha256:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-existing-desktop-${{ inputs.product_commit }}-${{ inputs.packet_sha256 }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PRODUCT_COMMIT: ${{ inputs.product_commit }}
      PRODUCT_TREE: ${{ inputs.product_tree }}
      PACKET_URL: ${{ inputs.packet_url }}
      PACKET_SHA256: ${{ inputs.packet_sha256 }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BACKPLANE_TELEMETRY: 'off'
      BACKPLANE_DESKTOP_BROWSER: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve frozen source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.product_commit }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependencies with native npm
        run: npm --prefix product/desktop ci --ignore-scripts --no-audit --no-fund
      - name: Establish bounded native identity-probe readiness
        run: |
          node <<'NODE'
          'use strict';
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
          const {execFileSync} = require('node:child_process');
          const {windowsProcessCommand} = require('./product/desktop/test/release-smoke.cjs');
          const shell = path.join(process.env.SystemRoot, 'System32/WindowsPowerShell/v1.0/powershell.exe');
          const report = {schema: 1, scope: 'Host readiness only; frozen product smoke and its 10-second probe stay unchanged', capturedPid: process.pid, probes: [], status: 'INCOMPLETE'};
          fs.mkdirSync('build', {recursive: true});
          try {
            for (const [phase, timeout] of [['cold', 45000], ['warm', 10000]]) {
              const start = performance.now();
              const identity = JSON.parse(execFileSync(shell, ['-NoProfile', '-NonInteractive', '-Command', windowsProcessCommand(process.pid)], {encoding: 'utf8', timeout, stdio: ['ignore', 'pipe', 'pipe']}));
              assert.equal(identity.pid, process.pid, 'Identity must name the captured own process');
              assert.equal(path.resolve(identity.executable).toLowerCase(), path.resolve(process.execPath).toLowerCase(), 'Identity must name this Node executable');
              assert(Number.isFinite(Date.parse(identity.birth)), 'Native birth stamp required');
              report.probes.push({phase, timeoutMs: timeout, elapsedMs: performance.now() - start, identity});
            }
            report.status = 'HOST_PROBE_READY_ONLY';
          } catch (error) { report.status = 'FAIL'; report.error = error.message; throw error; }
          finally { fs.writeFileSync('build/windows-probe-readiness.json', JSON.stringify(report, null, 2) + '\n'); }
          NODE
      - name: Stage existing component, brand on Windows, smoke and archive
        run: python tools/scripts/windows-existing-desktop-package.py --product product --out build/windows-existing
      - name: Require packaged startup as a standard user without Developer Mode
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem build/windows-existing/dist -File -Filter '*windows-x64.zip')
          if ($packages.Count -ne 1) { throw 'Expected one final Windows ZIP for standard-user qualification' }
          $version = (Get-Content product/desktop/package.json -Raw | ConvertFrom-Json).version
          $sha = (Get-FileHash $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          ./product/scripts/windows-standard-user-smoke.ps1 -PackagePath $packages[0].FullName -PackageSHA256 $sha -ExpectedVersion $version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-existing-desktop-package
          path: |
            build/windows-probe-readiness.json
            build/windows-existing/RESULT.json
            build/windows-existing/evidence/
            build/windows-existing/acceptance/
            build/windows-existing/dist/
            build/windows-existing/stage/STAGE.json
            build/windows-existing/stage.request.json
            product/build/windows-standard-user/result.json
            product/build/windows-standard-user/package.json
            product/build/windows-standard-user/unit-tests.txt
            product/build/windows-standard-user/*.png
          if-no-files-found: warn
          retention-days: 30
