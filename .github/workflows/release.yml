name: release
# Slow packaging, kept apart from ci.yml. A tag vX.Y.Z (stable) or vX.Y.Z-beta.N (prerelease) builds, signs and publishes a GitHub release.
# Run by hand (workflow_dispatch) it is a dry run: the archives and manifest.json are uploaded as workflow artifacts and nothing is published.
# Signing needs the repo secret BACKPLANE_RELEASE_KEY (an ed25519 private key, PEM) and BACKPLANE_RELEASE_KEY_ID; without them nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to stamp on the dry run
        default: v0.0.0-dryrun.1
      first_run:
        description: "smoke: an older dry run's run id (its release-dry-run artifact): installed first, then updated to this one"
        default: ""
      broken_run:
        description: "smoke: a dry run with a newer tag than this one whose hub dies at its start: rolled back from"
        default: ""
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner images, so the archives run on older glibc (22.04: glibc 2.35)
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # mold comes from a GitHub download too: two tries, then the build links without it (RUSTFLAGS set: .cargo/config's mold flag is skipped)
      - id: mold1
        uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
        continue-on-error: true
      - id: mold2
        if: runner.os == 'Linux' && steps.mold1.outcome == 'failure'
        uses: rui314/setup-mold@v1
        continue-on-error: true
      - if: runner.os == 'Linux' && steps.mold1.outcome == 'failure' && steps.mold2.outcome == 'failure'
        run: echo "RUSTFLAGS= " >> $GITHUB_ENV
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libwayland-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
            native/guard
            native/voice
          shared-key: release-${{ matrix.target }}
      - name: stamp the version
        run: |
          # the first `version = ` line of each crate (python, not sed: macOS's sed has no `0,/re/`, and its builds kept the old version, so the guard's
          # identity check would have refused every macOS update)
          python3 - "${TAG#v}" native/host/Cargo.toml native/gpui/Cargo.toml  native/guard/Cargo.toml <<'PY'
          import re, sys
          v = sys.argv[1]
          for p in sys.argv[2:]:
              s = open(p).read(); t = re.sub(r'(?m)^version = ".*"$', f'version = "{v}"', s, count=1)
              assert t != s or f'version = "{v}"' in s, p
              open(p, "w").write(t)
          PY
          grep -m1 '^version' native/host/Cargo.toml
      - name: build
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)   # compiled into the hub: the guard checks an update against it
          (cd native/host && cargo build --release --bin backplane-hub --bin bp-sh) & a=$!
          # the client with the embedded Chromium (feature cef) where the client can run it: Linux. macOS and Windows ship without it; their Browser tab is
          # the hub's frame stream from backplane-browser (docs/install.md); the client's CEF code finds a Linux runtime only (viewers/cef.rs runtime_dir)
          cef=; case "${{ matrix.target }}" in linux-*) cef="--features cef";; esac
          (cd native/gpui && cargo build --release $cef) & b=$!
          (cd native/guard && cargo build --release) & g=$!   # the guard: it starts the hub, updates it and brings it back (docs/deploy.md)
          (cd native/voice && cargo build --release --bin backplane-voice) & v=$!   # dictation's helper: the hub runs it from beside itself (voice/session.rs)
          wait $a; ra=$?; wait $b; rb=$?; wait $g; rg=$?; wait $v; rv=$?; exit $((ra | rb | rg | rv))
      - name: no test trust in a release
        run: |
          # feature e2e-trust (test/update's feed) trusts a key from the environment; its code carries this mark, so a release that has it is refused
          if grep -aq backplane-e2e-trust-enabled native/host/target/release/backplane-hub${{ runner.os == 'Windows' && '.exe' || '' }}; then echo "::error::backplane-hub was built with feature e2e-trust"; exit 1; fi
      # The Bun version here is deploy/bun-version's: change them together, and update deploy/licenses/bun (NOTICE.md and Bun's LICENSE.md at that tag)
      # whenever it changes. scripts/licenses.sh refuses a package built with a Bun the notices do not name.
      # bun for the browser helper and step2glb. Its download server has answered 504 more than once: a pinned version, kept in the Actions cache, and
      # up to three tries with a pause between, so a tag push never fails halfway on it
      - uses: actions/cache@v4
        with:
          path: ~/.bun
          key: bun-1.4.4-${{ runner.os }}-${{ runner.arch }}
      - id: bun1
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with: { bun-version: 1.4.4 }
      - if: steps.bun1.outcome == 'failure'
        run: sleep 30
      - id: bun2
        if: steps.bun1.outcome == 'failure'
        uses: oven-sh/setup-bun@v2
        continue-on-error: true
        with: { bun-version: 1.4.4 }
      - if: steps.bun1.outcome == 'failure' && steps.bun2.outcome == 'failure'
        run: sleep 90
      # GitHub's release downloads can be down for hours (504): the last try takes bun from npm's registry instead
      - if: steps.bun1.outcome == 'failure' && steps.bun2.outcome == 'failure'
        run: |
          for i in 1 2 3; do npm install -g bun@1.4.4 && break; sleep 30; done
          bun --version
      # licenses/rust: the notices of the Rust crates in each program, for this target (scripts/rust-licenses.sh). A crate under a licence outside
      # deploy/licenses/rust/about.toml's allow-list fails the release here. cargo-about is kept in ~/.cargo/bin by the rust cache.
      - name: rust notices
        run: |
          command -v cargo-about >/dev/null && [ "$(cargo-about --version)" = "cargo-about 0.9.3" ] || cargo install --locked --features cli cargo-about@0.9.3
          scripts/rust-licenses.sh ${{ matrix.target }} build/licenses/rust
      - name: package
        if: runner.os != 'Windows'
        run: |
          set -e
          d=pkg; mkdir -p $d
          cp native/host/target/release/backplane-hub native/gpui/target/release/backplane-gpui native/voice/target/release/backplane-voice $d/
          # dictation's voice activity model beside the helper, which takes it when it matches its pin (native/voice/vad/README.md): no download for it; its notice is licenses/silero-vad
          cp native/voice/vad/silero_vad.onnx $d/
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  $d/silero_vad.onnx" | sha256sum -c - || { echo "::error::silero_vad.onnx is not the pinned file (native/voice/src/local.rs)"; exit 1; }
          # the guard goes in every archive: an install without it can neither update nor recover (deploy/install.sh.in refuses one)
          [ -x native/guard/target/release/backplane ] || { echo "::error::no guard (native/guard) for ${{ matrix.target }}"; exit 1; }
          cp native/guard/target/release/backplane $d/
          # the Browser tab's helper and STEP's mesher (no FreeCAD needed), both bun programs: either missing fails the job
          (cd tools/browser && bun install --frozen-lockfile && bun build.ts "$PWD/../../$d/backplane-browser")
          (cd tools/step2glb && bun install --frozen-lockfile && bun build --compile step2glb.ts --outfile "$PWD/../../$d/backplane-step2glb")
          # Linux: CEF's runtime beside the client, where viewers/cef.rs runtime_dir looks in an install (libcef stripped: ~1.4 GB with symbols, ~270 MB without)
          case "${{ matrix.target }}" in linux-*)
            # the cef crate's distribution in its OUT_DIR (kept by the build cache, unlike the copy beside the binary, which a cached build leaves out)
            R=$(dirname "$(find native/gpui/target/release/build -path '*cef-dll-sys*' -name libcef.so | head -1)")
            [ -f "$R/libcef.so" ] || R=native/gpui/target/release
            echo "CEF runtime from $R"
            for f in libcef.so resources.pak chrome_100_percent.pak chrome_200_percent.pak icudtl.dat v8_context_snapshot.bin; do [ -f $R/$f ] || { echo "::error::CEF runtime file $f missing from the build"; exit 1; }; cp $R/$f $d/; done
            for f in libvk_swiftshader.so libvulkan.so.1 vk_swiftshader_icd.json; do [ ! -f $R/$f ] || cp $R/$f $d/; done
            cp -r $R/locales $d/locales; strip --strip-unneeded $d/libcef.so ;;
          esac
          cp -r assets $d/assets
          # the client's generated assets (assets/GENERATED.md): without them it draws no icons and no cats
          [ -s $d/assets/icons.json ] && [ "$(ls $d/assets/cat-rigs | wc -l)" -ge 576 ] || { echo "::error::assets/icons.json or assets/cat-rigs missing from the archive"; exit 1; }
          git rev-parse HEAD > $d/COMMIT
          scripts/licenses.sh $d ${{ matrix.target }} build/licenses/rust   # licenses/: every third-party notice (deploy/licenses/README.md)
          # everything a dev cut has (scripts/dev-build.sh), or the job fails: a release must not lose a feature a dev cut showed working
          need="backplane-hub backplane-gpui backplane backplane-voice silero_vad.onnx backplane-browser backplane-step2glb COMMIT assets/icons.json assets/cat-rigs"
          need="$need licenses/README.md licenses/LICENSE licenses/bun/NOTICE.md licenses/bun/LICENSE.md licenses/playwright-core/NOTICE licenses/step2glb/license.occt.txt licenses/silero-vad/LICENSE licenses/gpui/LICENSE-APACHE licenses/rust/hub.txt licenses/rust/client.txt licenses/rust/guard.txt licenses/rust/voice.txt"
          case "${{ matrix.target }}" in linux-*) need="$need libcef.so icudtl.dat resources.pak chrome_100_percent.pak v8_context_snapshot.bin locales/en-US.pak licenses/cef/LICENSE.txt licenses/cef/CREDITS.html";; esac
          for f in $need; do [ -e "$d/$f" ] || { echo "::error::$f missing from the ${{ matrix.target }} archive"; exit 1; }; done
          ls -la $d
          name=backplane-$TAG-${{ matrix.target }}-native.tar.gz   # -native: 0.14's updater takes any asset ending in <platform>.tar.gz (rel::archive_name)
          tar -C $d -czf $name .
          echo "ARCHIVE=$name" >> $GITHUB_ENV
      # Windows: a zip, as 0.14 shipped (backplane-<tag>-windows-x64.zip): the hub, the client, the guard and bp-sh (the hub's sh go-between, src/bin/bp-sh.rs) beside them.
      # The client is a release build, so gpui's HLSL shaders were compiled here by the Windows SDK's fxc.exe; its manifest by rc.exe.
      - name: package (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          d=pkg; mkdir -p $d
          for f in native/host/target/release/backplane-hub.exe native/host/target/release/bp-sh.exe native/gpui/target/release/backplane-gpui.exe native/guard/target/release/backplane.exe native/voice/target/release/backplane-voice.exe; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; cp "$f" $d/; done
          cp native/voice/vad/silero_vad.onnx $d/   # beside the voice helper, as on the other platforms (its notice: licenses/silero-vad)
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  $d/silero_vad.onnx" | sha256sum -c - || { echo "::error::silero_vad.onnx is not the pinned file (native/voice/src/local.rs)"; exit 1; }
          (cd tools/browser && bun install --frozen-lockfile && bun build.ts "$PWD/../../$d/backplane-browser.exe")
          (cd tools/step2glb && bun install --frozen-lockfile && bun build --compile step2glb.ts --outfile "$PWD/../../$d/backplane-step2glb.exe")
          cp -r assets $d/assets
          [ -s $d/assets/icons.json ] && [ "$(ls $d/assets/cat-rigs | wc -l)" -ge 576 ] || { echo "::error::assets/icons.json or assets/cat-rigs missing from the archive"; exit 1; }
          git rev-parse HEAD > $d/COMMIT
          scripts/licenses.sh $d ${{ matrix.target }} build/licenses/rust   # licenses/: every third-party notice (deploy/licenses/README.md)
          for f in backplane-hub.exe backplane-gpui.exe backplane.exe bp-sh.exe backplane-voice.exe silero_vad.onnx backplane-browser.exe backplane-step2glb.exe COMMIT assets/icons.json assets/cat-rigs \
                   licenses/README.md licenses/LICENSE licenses/bun/NOTICE.md licenses/bun/LICENSE.md licenses/playwright-core/NOTICE licenses/step2glb/license.occt.txt licenses/silero-vad/LICENSE licenses/gpui/LICENSE-APACHE licenses/rust/hub.txt licenses/rust/client.txt licenses/rust/guard.txt licenses/rust/voice.txt; do
            [ -e "$d/$f" ] || { echo "::error::$f missing from the windows-x64 archive"; exit 1; }; done
          ls -la $d
          name=backplane-$TAG-${{ matrix.target }}-native.zip
          (cd $d && 7z a -tzip -r "../$name" . > /dev/null)
          echo "ARCHIVE=$name" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # The Android data app (dev.backplane.mobile), signed with the release key 0.14.1 shipped with (repo secrets BACKPLANE_ANDROID_*). A job of its own, so an Android failure
  # is plain to see, and publish needs it: no release goes out without the APK. Its artifact is named archive-android, so publish's archive-* download picks the APK and
  # AAB up. A dry run also builds the same app under a side id (dev.backplane.mobile.rel, artifact android-sideid, never published), which installs beside a phone's own app.
  android:
    name: build android
    runs-on: ubuntu-latest
    env:
      CERT_SHA256: ef21acdb7d2de02106c29caf35eb73e704a152960e8113c8149eca1c305e906e   # CN=Backplane, O=Backplane: what 0.14.1's APK was signed with
      KEYSTORE_B64: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.BACKPLANE_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Gradle itself, without depending on GitHub: services.gradle.org redirects to github.com/gradle/gradle-distributions, which answered 504 for hours
      # (2026-11-08, dry run 42469337937). The zip is cached between runs, fetched with retries from Gradle and then from mirrors, and used only if its
      # sha256 is the one pinned in gradle-wrapper.properties (distributionSha256Sum), so a mirror cannot hand over anything else. The build runs it directly.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bp-gradle-dist
          key: gradle-dist-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
          key: gradle-deps-${{ hashFiles('mobile/android/**/*.gradle.kts', 'mobile/android/gradle/libs.versions.toml', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-deps-
      - name: gradle distribution (cached, retried, mirrored, sha256-checked)
        run: |
          set -e
          props=mobile/android/gradle/wrapper/gradle-wrapper.properties
          want=$(sed -n 's/^distributionSha256Sum=//p' $props); url=$(sed -n 's/^distributionUrl=//p' $props | sed 's/\\:/:/g')
          name=$(basename "$url"); ver=${name#gradle-}; ver=${ver%-bin.zip}
          [ -n "$want" ] && [ -n "$ver" ] || { echo "::error::gradle-wrapper.properties needs distributionUrl and distributionSha256Sum"; exit 1; }
          d=$HOME/.cache/bp-gradle-dist; mkdir -p "$d"; z=$d/$name
          ok() { [ -f "$z" ] && [ "$(sha256sum "$z" | cut -d' ' -f1)" = "$want" ]; }
          if ok; then echo "gradle $ver from the cache"; else
            for u in "$url" "https://github.com/gradle/gradle-distributions/releases/download/v$ver/$name" \
                     "https://mirrors.cloud.tencent.com/gradle/$name" "https://mirrors.aliyun.com/gradle/distributions/v$ver/$name" "https://mirrors.huaweicloud.com/gradle/$name"; do
              for wait in 5 15 45; do
                rm -f "$z.part"
                if curl -fsSL --connect-timeout 20 --max-time 600 -o "$z.part" "$u" && [ "$(sha256sum "$z.part" | cut -d' ' -f1)" = "$want" ]; then mv "$z.part" "$z"; echo "gradle $ver from $u"; break 2; fi
                echo "::warning::gradle $ver: $u failed or did not match the pinned sha256; again in ${wait}s"; sleep $wait
              done
            done
            rm -f "$z.part"; ok || { echo "::error::no source served gradle $ver with sha256 $want"; exit 1; }
          fi
          unzip -q -o "$z" -d "$RUNNER_TEMP/gradle"
          echo "GRADLE=$RUNNER_TEMP/gradle/gradle-$ver/bin/gradle" >> "$GITHUB_ENV"
      - name: release inputs
        run: |
          set -e
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || { echo "::error::the BACKPLANE_ANDROID_* signing secrets are not all set"; exit 1; }
          umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # a counter above every earlier release (0.14.1 was 2026110401), as the date and hour
          code=$(date -u +%Y%m%d%H); [ "$code" -gt 2026110401 ] || { echo "::error::version code $code is not above 0.14.1's"; exit 1; }
          { echo "BACKPLANE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"; echo "BACKPLANE_ANDROID_VERSION_NAME=${TAG#v}"; echo "BACKPLANE_ANDROID_VERSION_CODE=$code"; } >> "$GITHUB_ENV"
          echo "version ${TAG#v} ($code)"
      - name: build (APK and AAB)
        working-directory: mobile/android
        run: '"$GRADLE" --no-daemon -q -Pbp.appId=dev.backplane.mobile -Pbp.scheme=backplane -Pbp.appName=Backplane :app:assembleRelease :app:bundleRelease'
      - name: signed with the release key, or the job fails
        run: |
          set -e
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk; aab=mobile/android/app/build/outputs/bundle/release/app-release.aab
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          # every signer's certificate digest, the release key among them. apksigner's wording differs by build-tools version: "Signer #1 certificate SHA-256
          # digest: X" (35) and "V2 Signer: certificate SHA-256 digest: X" (the runner's), so take the 64 hex digits after "certificate SHA-256 digest:"
          "$bt/apksigner" verify --verbose --print-certs "$apk" > apk-certs.txt
          a=$(sed -n 's/.*[Ss]igner.*certificate SHA-256 digest: \([0-9a-f]\{64\}\).*/\1/p' apk-certs.txt | sort -u | tr '\n' ' ')
          b=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f' | sort -u | tr '\n' ' ')
          echo "apk signers: $a"; echo "aab signers: $b"; grep -E '^Verified using|^Number of signers' apk-certs.txt || true
          case " $a" in *" $CERT_SHA256 "*) ;; *) echo "::error::the APK is not signed with the release key ($CERT_SHA256)"; cat apk-certs.txt; exit 1;; esac
          case " $b" in *" $CERT_SHA256 "*) ;; *) echo "::error::the AAB is not signed with the release key ($CERT_SHA256)"; exit 1;; esac
          "$bt/aapt2" dump badging "$apk" | head -1
          cp "$apk" "backplane-$TAG-android.apk"; cp "$aab" "backplane-$TAG-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-android
          path: |
            backplane-${{ env.TAG }}-android.apk
            backplane-${{ env.TAG }}-android.aab
          retention-days: 7
      - name: the same build under a side id (dry run only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/android
        run: |
          set -e
          "$GRADLE" --no-daemon -q -Pbp.appId=dev.backplane.mobile.rel -Pbp.scheme=bprel -Pbp.appName="Backplane rel" :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/backplane-$TAG-android-sideid.apk"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: android-sideid
          path: backplane-${{ env.TAG }}-android-sideid.apk
          retention-days: 7
      - name: forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  publish:
    needs: [build, android]
    # a tag publishes only with every job green; a dry run (workflow_dispatch) still makes its artifact when only android failed, without the APK/AAB
    if: always() && needs.build.result == 'success' && (needs.android.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
      - name: manifest
        run: |
          set -e
          v="${TAG#v}"; ch=stable; case "$v" in *-*) ch=beta;; esac
          python3 - "$TAG" "$v" "$ch" "${{ github.sha }}" <<'PY'
          import hashlib, json, glob, os, sys
          tag, v, ch, sha = sys.argv[1:5]
          assets = {}
          for f in sorted(glob.glob(f"backplane-{tag}-*-native.tar.gz") + glob.glob(f"backplane-{tag}-*-native.zip")):
              t = f[len(f"backplane-{tag}-"):].removesuffix(".tar.gz").removesuffix(".zip").removesuffix("-native")
              assets[t] = {"name": f, "sha256": hashlib.sha256(open(f, "rb").read()).hexdigest(), "size": os.path.getsize(f)}
          open("manifest.json", "w").write(json.dumps({"schema": 1, "tag": tag, "version": v, "channel": ch, "commit": sha, "assets": assets}, indent=1))
          PY
      - name: installer
        run: |
          # deploy/install.sh.in with this release's version and each archive's sha256: the script vouches for what it downloads
          set -e
          sum() { f=backplane-$TAG-$1-native.tar.gz; [ -f "$f" ] && sha256sum "$f" | cut -d' ' -f1 || true; }
          sed -e "s|@REPO@|${{ github.repository }}|" -e "s|@VERSION@|$TAG|" -e "s|@SHA_LINUX_X64@|$(sum linux-x64)|" \
              -e "s|@SHA_LINUX_ARM64@|$(sum linux-arm64)|" -e "s|@SHA_DARWIN_ARM64@|$(sum darwin-arm64)|" deploy/install.sh.in > install.sh
          if grep -q '@[A-Z_0-9]*@' install.sh; then echo "::error::install.sh still has a placeholder"; exit 1; fi
          sh -n install.sh
      - name: sign
        id: sign
        env:
          KEY: ${{ secrets.BACKPLANE_RELEASE_KEY }}
          KEY_ID: ${{ secrets.BACKPLANE_RELEASE_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then echo "signed=false" >> $GITHUB_OUTPUT; echo "::warning::no BACKPLANE_RELEASE_KEY: nothing is published"; exit 0; fi
          umask 077; printf '%s\n' "$KEY" > k.pem
          openssl pkeyutl -sign -inkey k.pem -rawin -in manifest.json -out manifest.json.sig
          rm -f k.pem; printf '%s' "$KEY_ID" > manifest.json.keyid
          echo "signed=true" >> $GITHUB_OUTPUT
      - name: the way from 0.14
        run: |
          # 0.14's updater (src/server/update.bend, v0.14.1) takes the first asset ending in <platform>.tar.gz (linux-x64: linux-x64-cef.tar.gz), checks it
          # against SHA256SUMS and runs backplane-<platform>/install-release.sh from it: deploy/compat/ lays 0.15 out and hands over to the guard (docs/deploy.md)
          set -e
          native=$(ls backplane-$TAG-*-native.tar.gz)
          for plat in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            case "$native" in *"$plat.tar.gz"*) echo "::error::a -native archive ends in 0.14's suffix $plat.tar.gz"; exit 1;; esac
          done
          for t in linux-x64 linux-arm64 darwin-arm64; do
            n=backplane-$TAG-$t-native.tar.gz; [ -f "$n" ] || continue
            d=compat/backplane-$t; mkdir -p $d
            cp deploy/compat/install-release.sh deploy/compat/backplane-serve.sh $d/; cp "$n" $d/native.tar.gz; printf '%s\n' "$n" > $d/NATIVE; printf '%s\n' "$TAG" > $d/VERSION
            cp manifest.json $d/; [ ! -f manifest.json.sig ] || cp manifest.json.sig manifest.json.keyid $d/
            out=backplane-$TAG-$t.tar.gz; [ $t != linux-x64 ] || out=backplane-$TAG-linux-x64-cef.tar.gz
            tar -C compat -czf "$out" backplane-$t
          done
          sha256sum backplane-$TAG-*.tar.gz backplane-$TAG-*.zip $(ls backplane-$TAG-android.apk backplane-$TAG-android.aab 2>/dev/null) install.sh | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            backplane-*.tar.gz
            backplane-*.zip
            install.sh
            SHA256SUMS
            backplane-*-android.apk
            backplane-*-android.aab
            manifest.json
            manifest.json.sig
            manifest.json.keyid
          retention-days: 7
      - name: publish (tags only, signed only; manifest and signature go last)
        if: github.event_name == 'push' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=; case "$TAG" in *-*) pre=--prerelease;; esac
          gh release create "$TAG" $pre --draft --title "$TAG" --notes "" backplane-*.tar.gz backplane-*.zip backplane-$TAG-android.apk backplane-$TAG-android.aab install.sh SHA256SUMS
          # all three signed files, or the updater counts the release as half published and never offers it (update/run.rs SIGNED)
          gh release upload "$TAG" manifest.json manifest.json.sig manifest.json.keyid
          gh release edit "$TAG" --draft=false

  # The release-candidate smoke, dry runs only, on each target's own runner (test/update/rc-smoke.sh): the archive installed as a person would, the guard
  # starting the hub and /hello naming the manifest's version and commit, the helpers answering, the installed client drawing with every asset and its
  # Browser tab showing a local page; with next_run and broken_run, an update from a loopback feed and a rollback from a build that dies. On linux-x64 and
  # darwin-arm64 also the way from 0.14 (test/update/from-014.py): 0.14.1, installed from its release, updates itself to this dry run.
  smoke:
    needs: publish
    if: github.event_name == 'workflow_dispatch' && always() && needs.publish.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    name: smoke ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-dry-run, path: rel }
      - uses: actions/download-artifact@v4
        if: github.event.inputs.first_run != ''
        with: { name: release-dry-run, path: first, run-id: "${{ github.event.inputs.first_run }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        if: github.event.inputs.broken_run != ''
        with: { name: release-dry-run, path: broken, run-id: "${{ github.event.inputs.broken_run }}", github-token: "${{ github.token }}" }
      - name: display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends xvfb i3 mesa-vulkan-drivers libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon-x11-0 libasound2 > /dev/null
      - name: rc-smoke
        run: |
          set -o pipefail; mkdir -p logs
          RC_DIR=$RUNNER_TEMP RC_KEEP=1 RC_LOGS=$PWD/logs bash test/update/rc-smoke.sh rel | tee smoke.txt
      - name: update and rollback
        # the older dry run installed (Windows: its zip's --install), this one taken from a loopback feed, the broken one rolled back from
        if: always() && hashFiles('first/manifest.json') != '' && hashFiles('broken/manifest.json') != ''
        run: |
          set -o pipefail
          RC_DIR=$RUNNER_TEMP UPD_DIR=$RUNNER_TEMP bash test/update/install-e2e.sh first rel broken | tee update.txt
      - name: the way from 0.14
        if: always() && (matrix.target == 'linux-x64' || matrix.target == 'darwin-arm64')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -o pipefail
          # 0.14's stable channel takes only plain vX.Y.Z tags: a -beta.N dry run is never offered to it
          case "$TAG" in *-*) echo "the way from 0.14 needs a plain tag (this dry run is $TAG): skipped"; exit 0;; esac
          plat=${{ matrix.target }}; mkdir -p v0141
          gh release download v0.14.1 --repo ${{ github.repository }} -p install.sh -p "backplane-v0.14.1-$plat.tar.gz" -D v0141
          UPD_DIR=$RUNNER_TEMP python3 -I test/update/from-014.py v0141 rel | tee from014.txt
          if [ -d broken ]; then UPD_DIR=$RUNNER_TEMP python3 -I test/update/from-014.py v0141 broken --panics | tee -a from014.txt; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: |
            smoke.txt
            update.txt
            from014.txt
            logs/
          retention-days: 7
