name: release
# Slow packaging, kept apart from ci.yml. A tag vX.Y.Z (stable) or vX.Y.Z-beta.N (prerelease) builds, signs and publishes a GitHub release.
# Run by hand (workflow_dispatch) it is a dry run: the archives and manifest.json are uploaded as workflow artifacts and nothing is published.
# Signing needs the repo secret BACKPLANE_RELEASE_KEY (an ed25519 private key, PEM) and BACKPLANE_RELEASE_KEY_ID; without them nothing is published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to stamp on the dry run
        default: v0.0.0-dryrun.1
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner images, so the archives run on older glibc (22.04: glibc 2.35)
          - { target: linux-x64, os: ubuntu-22.04 }
          - { target: linux-arm64, os: ubuntu-22.04-arm }
          - { target: darwin-arm64, os: macos-latest }
          - { target: windows-x64, os: windows-latest }
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
        if: runner.os == 'Linux'
      - name: system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev libasound2-dev libwayland-dev libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/host
            native/gpui
            native/guard
          shared-key: release-${{ matrix.target }}
      - name: stamp the version
        run: |
          v="${TAG#v}"
          sed -i.bak -E '0,/^version = ".*"/s//version = "'"$v"'"/' native/host/Cargo.toml native/gpui/Cargo.toml
          rm -f native/host/Cargo.toml.bak native/gpui/Cargo.toml.bak
      - name: build
        run: |
          export BACKPLANE_COMMIT=$(git rev-parse --short HEAD)   # compiled into the hub: the guard checks an update against it
          (cd native/host && cargo build --release --bin backplane-hub --bin bp-sh) & a=$!
          (cd native/gpui && cargo build --release) & b=$!
          (cd native/guard && cargo build --release) & g=$!   # the guard: it starts the hub, updates it and brings it back (docs/deploy.md)
          wait $a; ra=$?; wait $b; rb=$?; wait $g; rg=$?; exit $((ra | rb | rg))
      - name: no test trust in a release
        run: |
          # feature e2e-trust (test/update's feed) trusts a key from the environment; its code carries this mark, so a release that has it is refused
          if grep -aq backplane-e2e-trust-enabled native/host/target/release/backplane-hub${{ runner.os == 'Windows' && '.exe' || '' }}; then echo "::error::backplane-hub was built with feature e2e-trust"; exit 1; fi
      - uses: oven-sh/setup-bun@v2
      - name: package
        if: runner.os != 'Windows'
        run: |
          set -e
          d=pkg; mkdir -p $d
          cp native/host/target/release/backplane-hub native/gpui/target/release/backplane-gpui $d/
          # the guard goes in every archive: an install without it can neither update nor recover (deploy/install.sh.in refuses one)
          [ -x native/guard/target/release/backplane ] || { echo "::error::no guard (native/guard) for ${{ matrix.target }}"; exit 1; }
          cp native/guard/target/release/backplane $d/
          (cd tools/browser && bun install --frozen-lockfile && bun build.ts "$PWD/../../$d/backplane-browser") || echo "no browser helper built"
          cp -r assets $d/assets
          git rev-parse HEAD > $d/COMMIT
          name=backplane-$TAG-${{ matrix.target }}.tar.gz
          tar -C $d -czf $name .
          echo "ARCHIVE=$name" >> $GITHUB_ENV
      # Windows: a zip, as 0.14 shipped (backplane-<tag>-windows-x64.zip): the hub, the client, the guard and bp-sh (the hub's sh go-between, src/bin/bp-sh.rs) beside them.
      # The client is a release build, so gpui's HLSL shaders were compiled here by the Windows SDK's fxc.exe; its manifest by rc.exe.
      - name: package (Windows)
        if: runner.os == 'Windows'
        run: |
          set -e
          d=pkg; mkdir -p $d
          for f in native/host/target/release/backplane-hub.exe native/host/target/release/bp-sh.exe native/gpui/target/release/backplane-gpui.exe native/guard/target/release/backplane.exe; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }; cp "$f" $d/; done
          cp -r assets $d/assets
          git rev-parse HEAD > $d/COMMIT
          name=backplane-$TAG-${{ matrix.target }}.zip
          (cd $d && 7z a -tzip -r "../$name" . > /dev/null)
          echo "ARCHIVE=$name" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  # The Android data app (dev.backplane.mobile), signed with the release key 0.14.1 shipped with (repo secrets BACKPLANE_ANDROID_*). A job of its own, so an Android failure
  # is plain to see, and publish needs it: no release goes out without the APK. Its artifact is named archive-android, so publish's archive-* download picks the APK and
  # AAB up. A dry run also builds the same app under a side id (dev.backplane.mobile.rel, artifact android-sideid, never published), which installs beside a phone's own app.
  android:
    name: build android
    runs-on: ubuntu-latest
    env:
      CERT_SHA256: ef21acdb7d2de02106c29caf35eb73e704a152960e8113c8149eca1c305e906e   # CN=Backplane, O=Backplane: what 0.14.1's APK was signed with
      KEYSTORE_B64: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.BACKPLANE_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: release inputs
        run: |
          set -e
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] || { echo "::error::the BACKPLANE_ANDROID_* signing secrets are not all set"; exit 1; }
          umask 077; printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # a counter above every earlier release (0.14.1 was 2026110401), as the date and hour
          code=$(date -u +%Y%m%d%H); [ "$code" -gt 2026110401 ] || { echo "::error::version code $code is not above 0.14.1's"; exit 1; }
          { echo "BACKPLANE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"; echo "BACKPLANE_ANDROID_VERSION_NAME=${TAG#v}"; echo "BACKPLANE_ANDROID_VERSION_CODE=$code"; } >> "$GITHUB_ENV"
          echo "version ${TAG#v} ($code)"
      - name: build (APK and AAB)
        working-directory: mobile/android
        run: ./gradlew --no-daemon -q -Pbp.appId=dev.backplane.mobile -Pbp.scheme=backplane -Pbp.appName=Backplane :app:assembleRelease :app:bundleRelease
      - name: signed with the release key, or the job fails
        run: |
          set -e
          apk=mobile/android/app/build/outputs/apk/release/app-release.apk; aab=mobile/android/app/build/outputs/bundle/release/app-release.aab
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          a=$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          b=$(keytool -printcert -jarfile "$aab" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "apk $a"; echo "aab $b"
          [ "$a" = "$CERT_SHA256" ] && [ "$b" = "$CERT_SHA256" ] || { echo "::error::not signed with the release key ($CERT_SHA256)"; exit 1; }
          "$bt/aapt2" dump badging "$apk" | head -1
          cp "$apk" "backplane-$TAG-android.apk"; cp "$aab" "backplane-$TAG-android.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-android
          path: |
            backplane-${{ env.TAG }}-android.apk
            backplane-${{ env.TAG }}-android.aab
          retention-days: 7
      - name: the same build under a side id (dry run only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: mobile/android
        run: |
          set -e
          ./gradlew --no-daemon -q -Pbp.appId=dev.backplane.mobile.rel -Pbp.scheme=bprel -Pbp.appName="Backplane rel" :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/backplane-$TAG-android-sideid.apk"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: android-sideid
          path: backplane-${{ env.TAG }}-android-sideid.apk
          retention-days: 7
      - name: forget the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: deploy
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
      - name: manifest
        run: |
          set -e
          v="${TAG#v}"; ch=stable; case "$v" in *-*) ch=beta;; esac
          python3 - "$TAG" "$v" "$ch" "${{ github.sha }}" <<'PY'
          import hashlib, json, glob, os, sys
          tag, v, ch, sha = sys.argv[1:5]
          assets = {}
          for f in sorted(glob.glob(f"backplane-{tag}-*.tar.gz") + glob.glob(f"backplane-{tag}-*.zip")):
              t = f[len(f"backplane-{tag}-"):].removesuffix(".tar.gz").removesuffix(".zip")
              assets[t] = {"name": f, "sha256": hashlib.sha256(open(f, "rb").read()).hexdigest(), "size": os.path.getsize(f)}
          open("manifest.json", "w").write(json.dumps({"schema": 1, "tag": tag, "version": v, "channel": ch, "commit": sha, "assets": assets}, indent=1))
          PY
      - name: installer
        run: |
          # deploy/install.sh.in with this release's version and each archive's sha256: the script vouches for what it downloads
          set -e
          sum() { f=backplane-$TAG-$1.tar.gz; [ -f "$f" ] && sha256sum "$f" | cut -d' ' -f1 || true; }
          sed -e "s|@REPO@|${{ github.repository }}|" -e "s|@VERSION@|$TAG|" -e "s|@SHA_LINUX_X64@|$(sum linux-x64)|" \
              -e "s|@SHA_LINUX_ARM64@|$(sum linux-arm64)|" -e "s|@SHA_DARWIN_ARM64@|$(sum darwin-arm64)|" deploy/install.sh.in > install.sh
          if grep -q '@[A-Z_0-9]*@' install.sh; then echo "::error::install.sh still has a placeholder"; exit 1; fi
          sh -n install.sh
      - name: sign
        id: sign
        env:
          KEY: ${{ secrets.BACKPLANE_RELEASE_KEY }}
          KEY_ID: ${{ secrets.BACKPLANE_RELEASE_KEY_ID }}
        run: |
          if [ -z "$KEY" ]; then echo "signed=false" >> $GITHUB_OUTPUT; echo "::warning::no BACKPLANE_RELEASE_KEY: nothing is published"; exit 0; fi
          umask 077; printf '%s\n' "$KEY" > k.pem
          openssl pkeyutl -sign -inkey k.pem -rawin -in manifest.json -out manifest.json.sig
          rm -f k.pem; printf '%s' "$KEY_ID" > manifest.json.keyid
          echo "signed=true" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: |
            backplane-*.tar.gz
            backplane-*.zip
            install.sh
            manifest.json
            manifest.json.sig
            manifest.json.keyid
          retention-days: 7
      - name: publish (tags only, signed only; manifest and signature go last)
        if: github.event_name == 'push' && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=; case "$TAG" in *-*) pre=--prerelease;; esac
          gh release create "$TAG" $pre --draft --title "$TAG" --notes "" backplane-*.tar.gz backplane-*.zip install.sh
          # all three signed files, or the updater counts the release as half published and never offers it (update/run.rs SIGNED)
          gh release upload "$TAG" manifest.json manifest.json.sig manifest.json.keyid
          gh release edit "$TAG" --draft=false
