name: Electron release candidate (artifact only)

# No push/tag trigger, install, store upload, gh release or write permission.
# Root selects each frozen artifact/producer operation and alone publishes.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage, preserve qualified archives, or collect all seven target packages
        type: choice
        options: [collect, stage-desktop, archive-desktop, android-artifacts, web-artifacts]
        default: collect
      target:
        description: Desktop producer target; ignored by collect
        type: choice
        options: [linux-x64, linux-arm64, darwin-arm64, windows-x64]
        default: linux-x64
      ref:
        description: Full accepted frozen source commit
        required: true
        type: string
      version:
        description: Exact stable tag spelling; this workflow creates no tag
        required: true
        default: v0.12.1
        type: string
      producer_run_id:
        description: Completed successful run containing owner-produced package artifacts
        required: true
        type: string
      producer_artifact_ids:
        description: Comma-separated immutable artifact IDs in that run
        required: true
        type: string
      inputs_sha256:
        description: Root-reviewed SHA256 of input index, desktop request, or desktop acceptance
        required: true
        type: string
      telemetry_url:
        description: Future producer compile endpoint; not a key or runtime override
        default: https://backplane.works/api/v1/events
        type: string
  workflow_call:
    inputs:
      operation:
        type: string
        default: collect
      target:
        type: string
        default: linux-x64
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      producer_run_id:
        default: ''
        type: string
      producer_artifact_ids:
        default: ''
        type: string
      inputs_sha256:
        default: ''
        type: string
      telemetry_url:
        default: https://backplane.works/api/v1/events
        type: string

permissions:
  contents: read
  actions: read

jobs:
  candidate-assets:
    name: Frozen artifact orchestration; no publication
    # This is supplied-artifact assembly, never target service execution.
    # Signing and actual platform gates happen with their native owners.
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.version }}
      PRODUCER_RUN: ${{ inputs.producer_run_id }}
      PRODUCER_IDS: ${{ inputs.producer_artifact_ids }}
      INPUTS_SHA256: ${{ inputs.inputs_sha256 }}
      WORKFLOW_COMMIT: ${{ github.sha }}
      OPERATION: ${{ inputs.operation }}
      DESKTOP_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require exact frozen workflow, source and producer run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CHECK'
          import json, os, re, runpy, subprocess
          from pathlib import Path
          e = os.environ
          commit, tag = e['SOURCE_COMMIT'], e['RELEASE_TAG']
          runpy.run_path('scripts/release-assets.py')['identity'](commit, tag)
          if tag != 'v0.12.1':
              raise SystemExit('this stable preparation targets v0.12.1 only')
          if e['WORKFLOW_COMMIT'] != commit or subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != commit:
              raise SystemExit('workflow and checkout must equal frozen source')
          if not re.fullmatch(r'[1-9][0-9]*', e['PRODUCER_RUN']) or not re.fullmatch(r'[1-9][0-9]*(,[1-9][0-9]*)*', e['PRODUCER_IDS']):
              raise SystemExit('root-selected producer run and artifact IDs required')
          if e['OPERATION'] not in ('collect','stage-desktop','archive-desktop','android-artifacts','web-artifacts') or e['DESKTOP_TARGET'] not in ('linux-x64','linux-arm64','darwin-arm64','windows-x64'):
              raise SystemExit('unsupported producer operation or target')
          if e['OPERATION'] in ('stage-desktop','archive-desktop') and not Path('desktop/produce-release.cjs').is_file():
              raise SystemExit('desktop owner callable producer is not integrated')
          required = {'android-artifacts':'scripts/build-android-artifacts.py', 'web-artifacts':'desktop/produce-web-release.cjs'}
          if e['OPERATION'] in required and not Path(required[e['OPERATION']]).is_file():
              raise SystemExit('target owner callable producer is not integrated')
          ids = e['PRODUCER_IDS'].split(',')
          if len(ids) != len(set(ids)) or not re.fullmatch(r'[0-9a-f]{64}', e['INPUTS_SHA256']):
              raise SystemExit('unique artifact IDs and input-index digest required')
          run = json.loads(subprocess.check_output(['gh','api',f"repos/{e['GITHUB_REPOSITORY']}/actions/runs/{e['PRODUCER_RUN']}"]))
          if (run.get('head_sha'), run.get('status'), run.get('conclusion')) != (commit, 'completed', 'success'):
              raise SystemExit('producer run must be successful and match frozen source')
          for artifact_id in ids:
              item = json.loads(subprocess.check_output(['gh','api',f"repos/{e['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}"]))
              if item.get('expired') or str(item.get('workflow_run',{}).get('id')) != e['PRODUCER_RUN']:
                  raise SystemExit('artifact expired or belongs to another run')
          CHECK
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ inputs.producer_artifact_ids }}
          merge-multiple: true
          path: build/release-inputs
      - name: Bind reviewed input index before parsing packages
        run: |
          python3 - <<'CHECK'
          import hashlib, os
          from pathlib import Path
          names = {'collect':'release-inputs.json', 'stage-desktop':'desktop-release-request.json', 'archive-desktop':'desktop-release-acceptance.json', 'android-artifacts':'android-release-inputs.json', 'web-artifacts':'web-release-request.json'}
          p = Path('build/release-inputs') / names[os.environ['OPERATION']]
          if p.is_symlink() or hashlib.sha256(p.read_bytes()).hexdigest() != os.environ['INPUTS_SHA256']:
              raise SystemExit('producer input index differs from root-reviewed bytes')
          if os.environ['OPERATION'] == 'collect':
              import json, subprocess
              r = json.loads(p.read_bytes())
              if r.get('sourceTree') != subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip():
                  raise SystemExit('input index tree differs from frozen checkout')
          CHECK
      - uses: actions/setup-node@v4
        if: inputs.operation == 'stage-desktop' || inputs.operation == 'archive-desktop' || inputs.operation == 'web-artifacts'
        with:
          node-version: '22'
      - name: Stage explicit target inputs through the desktop owner's producer
        if: inputs.operation == 'stage-desktop'
        run: |
          node desktop/produce-release.cjs stage --request build/release-inputs/desktop-release-request.json --output "$GITHUB_WORKSPACE/build/desktop-stage-upload/desktop-stage"
      - name: Archive only the signed and target-qualified final payload
        if: inputs.operation == 'archive-desktop'
        run: |
          node desktop/produce-release.cjs archive --stage build/release-inputs/desktop-stage --acceptance build/release-inputs/desktop-release-acceptance.json --output "$GITHUB_WORKSPACE/build/desktop-dist"
      - uses: actions/setup-java@v4
        if: inputs.operation == 'android-artifacts'
        with:
          distribution: temurin
          java-version: '17'
      - name: Produce configured Android Release artifacts without installation or store upload
        if: inputs.operation == 'android-artifacts'
        env:
          BACKPLANE_ANDROID_KEYSTORE_BASE64: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BACKPLANE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/build-android-artifacts.py --inputs build/release-inputs/android-release-inputs.json --source "$GITHUB_WORKSPACE" --output "$GITHUB_WORKSPACE/build/android-release"
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'android-artifacts'
        with:
          name: android-release-artifacts
          path: |
            build/android-release/*.apk
            build/android-release/*.aab
            build/android-release/*.receipt.json
            build/android-release/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Standalone frozen generated-web producer (no service/helper build)
        if: inputs.operation == 'web-artifacts'
        run: |
          node desktop/produce-web-release.cjs archive --request build/release-inputs/web-release-request.json --output "$GITHUB_WORKSPACE/build/web-release"
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'web-artifacts'
        with:
          name: web-release-artifacts
          path: build/web-release/*
          if-no-files-found: error
          retention-days: 14
      - name: Collect exact Electron, web, Android and iOS packages
        if: inputs.operation == 'collect'
        run: |
          python3 scripts/release-assets.py collect --directory build/release-inputs --manifest build/release-inputs/release-inputs.json --source "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
          python3 scripts/release-assets.py verify --directory build/release-inputs --source "$SOURCE_COMMIT" --tag "$RELEASE_TAG" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'stage-desktop'
        with:
          name: desktop-stage-${{ inputs.target }}-unqualified
          path: build/desktop-stage-upload/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'archive-desktop'
        with:
          name: desktop-release-${{ inputs.target }}
          path: |
            build/desktop-dist/*.tar.gz
            build/desktop-dist/*.zip
            build/desktop-dist/*.sha256
            build/desktop-dist/*/DESKTOP.json
            build/desktop-dist/*/MANIFEST.json
            build/desktop-dist/*/NOTICES.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'collect'
        with:
          name: release-candidate-assets
          path: build/release-inputs/*
          if-no-files-found: error
          retention-days: 14
