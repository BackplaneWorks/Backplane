name: Release candidate (build only)

# Publication is deliberately not a workflow side effect. Bub publishes the
# accepted downloaded bundle after native/content/auth/telemetry gates pass.
on:
  workflow_dispatch:
    inputs:
      telemetry_url:
        description: Approved endpoint for the frozen candidate native compile
        type: string
        default: https://backplane.works/api/v1/events
      ref:
        description: Full frozen source commit (40 hex characters)
        required: true
        type: string
      version:
        description: Full package tag, e.g. v0.11.2 (no tag is created)
        required: true
        default: v0.11.2
        type: string
  workflow_call:
    inputs:
      telemetry_url:
        description: Approved endpoint for the frozen candidate native compile
        type: string
        default: https://backplane.works/api/v1/events
      ref:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Validate frozen inputs
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Require exact source and full version
        id: identity
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.version }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'CHECK'
          import os, re, runpy, subprocess
          from pathlib import Path
          commit, tag = os.environ['SOURCE_COMMIT'], os.environ['RELEASE_TAG']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('candidate requires a full source commit')
          runpy.run_path('scripts/release-assets.py')['identity'](commit, tag)
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != commit or os.environ['WORKFLOW_COMMIT'] != commit:
              raise SystemExit('workflow and checkout must match the frozen source')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write(f'commit={commit}\ntag={tag}\n')
          CHECK
      - name: Reject missing or mismatched release bake inputs before builds
        env:
          BACKPLANE_GOOGLE_BAKE: "1"
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_TELEMETRY_BAKE: "1"
          BACKPLANE_TELEMETRY_URL: ${{ inputs.telemetry_url }}
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: python3 scripts/release-assets.py check-bake --source "$SOURCE_COMMIT" --tag "$RELEASE_TAG"

  windows:
    needs: [candidate]
    name: Windows
    uses: ./.github/workflows/windows.yml
    secrets: inherit
    with:
      ref: ${{ needs.candidate.outputs.commit }}
      version: ${{ needs.candidate.outputs.tag }}
      telemetry_url: ${{ inputs.telemetry_url }}

  laws:
    needs: [candidate]
    name: Check and prove
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: ./.github/actions/setup-bend
      - run: scripts/check.sh

  build:
    needs: [candidate]
    name: Build ${{ matrix.target }}
    # beside "laws"; candidate assembly needs both
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64,    os: ubuntu-24.04 }
          - { target: linux-arm64,  os: ubuntu-24.04-arm }
          # darwin-arm64 is the two jobs below
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.candidate.outputs.tag }}
      BACKPLANE_CEF_RELEASE: ${{ matrix.target == 'linux-x64' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
      - name: Swap for the compile
        # bend's emit of the app takes 16-22 GB; the Linux runners have 16, so
        # without swap it can be killed. (The clang compiles no longer need
        # it: scripts/build-app.sh cuts the C into 16 units of about 2.5 GB.)
        if: runner.os == 'Linux'
        # the swap file goes on /mnt when the runner has it, and never takes
        # more than the free space less 8 GB (a full disk kills the runner)
        run: |
          dir=/; [ -d /mnt ] && dir=/mnt
          df -h / /mnt || true
          free_gb=$(df -BG --output=avail "$dir" | tail -1 | tr -dc 0-9)
          size=$(( free_gb - 8 )); [ "$size" -gt 16 ] && size=16
          if [ "$size" -ge 2 ]; then
            sudo fallocate -l "${size}G" "$dir/swap-build"
            sudo chmod 600 "$dir/swap-build"
            sudo mkswap "$dir/swap-build"
            sudo swapon "$dir/swap-build"
          else
            echo "only ${free_gb} GB free on $dir: no swap"
          fi
          free -h
      - name: Install clang 19 and X11 headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 libx11-dev cmake ninja-build
          if [ "${{ matrix.target }}" = linux-x64 ]; then
            sudo apt-get install -y xvfb libxtst6 libnss3 libatk-bridge2.0-0t64 libcups2t64 libasound2t64
          fi
          sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
      - name: Object cache
        # the compiled C units, by hash of their text (scripts/cc-unit.sh): an
        # unchanged unit is not compiled again. Never holds the Google client
        # (a unit that includes it is not cached).
        uses: actions/cache@v4
        with:
          path: ~/.cache/backplane-bend/obj
          key: objs-${{ matrix.target }}-${{ needs.candidate.outputs.tag }}
          restore-keys: objs-${{ matrix.target }}-
      - run: BACKPLANE_VERSION="$TAG" scripts/build.sh
        env:
          BACKPLANE_SKIP_CHECK: "1" # the laws job checks every file; candidate assembly needs it
          # the Google client "Connect Google" signs in with (scripts/build-app.sh)
          BACKPLANE_GOOGLE_BAKE: "1"
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_TELEMETRY_BAKE: "1"
          BACKPLANE_TELEMETRY_URL: ${{ inputs.telemetry_url }}
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
      - run: scripts/smoke.sh
      - name: Native CEF popup acceptance
        if: matrix.target == 'linux-x64'
        # Retain263's mandatory functional gate. Software Xvfb does not certify FPS.
        # Current official runtime fails this gate; no fallback or waiver here.
        run: BACKPLANE_CEF_NO_GPU=1 BACKPLANE_CEF="$PWD/dist/browser-runtime/cef/backplane-cef" BACKPLANE_BROWSER="$PWD/dist/backplane-browser" bun tools/browser/test/popup-cef.ts
      - run: scripts/package.sh "$TAG" "${{ matrix.target }}"
      - run: scripts/package-linux.sh "$TAG" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-${{ matrix.target }}
          path: |
            dist/backplane-*.tar.gz
            dist/backplane-*.AppImage
            dist/backplane_*.deb

  # macOS: the hub and web UI as `backplane` (no X11, so no window). bend's
  # emit of the server takes over 8 GB, which a macOS runner (7 GB) spends
  # hours swapping through, and its C is the same on every platform: a
  # Linux runner emits it with the web client, the Mac compiles it.
  emit-darwin:
    needs: [candidate]
    name: Emit darwin-arm64
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: ./.github/actions/setup-bend
      - run: BACKPLANE_VERSION="$TAG" BACKPLANE_SKIP_CHECK=1 scripts/build.sh emit
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64-emitted
          retention-days: 1
          path: |
            dist/web
            dist/kistack
            build/cc/backplane-serve/all.c
            build/wire

  build-darwin:
    name: Build darwin-arm64
    needs: [candidate, emit-darwin]
    runs-on: macos-15
    env:
      TAG: ${{ needs.candidate.outputs.tag }}
      BACKPLANE_PREBUILT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: ./.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64-emitted
          path: .
      - run: clang --version
      - run: BACKPLANE_VERSION="$TAG" scripts/build.sh
        env:
          BACKPLANE_GOOGLE_BAKE: "1"
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_TELEMETRY_BAKE: "1"
          BACKPLANE_TELEMETRY_URL: ${{ inputs.telemetry_url }}
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
      - run: scripts/smoke.sh
      - run: scripts/package.sh "$TAG" darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: backplane-darwin-arm64
          path: dist/backplane-*.tar.gz

  candidate-assets:
    name: Preserve candidate assets (not publication)
    needs: [candidate, laws, build, build-darwin, windows]
    runs-on: ubuntu-24.04
    env:
      SOURCE_COMMIT: ${{ needs.candidate.outputs.commit }}
      RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: backplane-*
          merge-multiple: true
      - name: Hash and bind the exact candidate files
        run: |
          python3 scripts/release-assets.py collect --directory out --source "$SOURCE_COMMIT" --tag "$RELEASE_TAG" --require-cef
          python3 scripts/release-assets.py verify --directory out --source "$SOURCE_COMMIT" --tag "$RELEASE_TAG" --require-cef
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-assets
          path: out/*
          if-no-files-found: error
          retention-days: 14
