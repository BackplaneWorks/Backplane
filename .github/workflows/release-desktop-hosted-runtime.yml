name: Essential existing desktop runtime and archive (artifact only)

on:
  workflow_dispatch:
    inputs:
      request_url:
        type: string
        required: true
      request_sha256:
        type: string
        required: true
      target:
        type: choice
        options: [both, linux-x64, linux-arm64, darwin-arm64]
        default: both
        required: true

permissions:
  contents: read

concurrency:
  group: release-desktop-essential-8147-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target == 'both' && '["linux-x64","darwin-arm64"]' || format('["{0}"]', inputs.target)) }}
    runs-on: ${{ matrix.target == 'linux-x64' && 'ubuntu-24.04' || matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'macos-14' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Allow app user namespaces on ephemeral Linux runner
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          # Keep global userns restrictions and stage modes intact. Permit only
          # the actual app path and the existing host capability probe.
          python3 - <<'PY' > "$RUNNER_TEMP/backplane-userns.profile"
          import os, re
          app = os.environ['GITHUB_WORKSPACE'] + '/build/essential-runtime/stage-input/stage/runtime/backplane-desktop'
          assert re.fullmatch(r'/[-A-Za-z0-9_/]+', app)
          print('abi <abi/4.0>,')
          for name, exe in [('backplane-release-electron', app), ('backplane-release-probe', '/usr/bin/unshare')]:
              print(f'profile {name} {exe} flags=(unconfined) {{\n  userns,\n}}')
          PY
          sudo apparmor_parser --replace "$RUNNER_TEMP/backplane-userns.profile"
          unshare --user --map-root-user /bin/true
      - name: Require native host then run exact existing desktop artifacts
        env:
          REQUEST_URL: ${{ inputs.request_url }}
          REQUEST_SHA: ${{ inputs.request_sha256 }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          python3 scripts/release-desktop-hosted-runtime.py --request-url "$REQUEST_URL" --request-sha256 "$REQUEST_SHA" --target "$TARGET" --out "$GITHUB_WORKSPACE/build/essential-runtime"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-essential-${{ matrix.target }}
          path: |
            build/essential-runtime/evidence/
            build/essential-runtime/acceptance/
            build/essential-runtime/dist/
            build/essential-runtime/*.json
            build/essential-runtime/*.stdout
            build/essential-runtime/*.stderr
            ${{ runner.temp }}/backplane-userns.profile
          if-no-files-found: warn
          retention-days: 14
