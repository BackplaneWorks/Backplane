name: Frozen 0.13 Windows runtime and desktop packaging recovery
on:
  workflow_dispatch:
    inputs:
      runtime_url: {type: string, required: true}
      runtime_sha256: {type: string, required: true}
      components_url: {type: string, required: true}
      components_sha256: {type: string, required: true}
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen013-windows-recovery-74d943
  cancel-in-progress: false
jobs:
  package-windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHON: python
      BACKPLANE_TELEMETRY: 'off'
      BACKPLANE_DESKTOP_BROWSER: '1'
      RUNTIME_URL: ${{ inputs.runtime_url }}
      RUNTIME_SHA: ${{ inputs.runtime_sha256 }}
      COMPONENTS_URL: ${{ inputs.components_url }}
      COMPONENTS_SHA: ${{ inputs.components_sha256 }}
    steps:
      - name: Preserve committed source bytes on Windows
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 74d943b7db3ceab37893b350308cf1802f38fe6b
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: configured-service-build-windows-x64
          run-id: 40748872940
          github-token: ${{ github.token }}
          path: source/build
      - name: Fetch exact retained runtime and current shell components
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,os,urllib.request,hashlib,tarfile
          base=pathlib.Path('inputs');base.mkdir()
          for name in ['RUNTIME','COMPONENTS']:
              u=os.environ[name+'_URL'];h=os.environ[name+'_SHA'];assert u.startswith('https://') and len(h)==64
              p=base/(name.lower()+'.tar.gz')
              with urllib.request.urlopen(u,timeout=90) as response,p.open('wb') as f:
                  while b:=response.read(1024*1024):f.write(b)
              with p.open('rb') as f:assert hashlib.file_digest(f,'sha256').hexdigest()==h
              dest=base/name.lower();dest.mkdir()
              with tarfile.open(p) as tar:tar.extractall(dest,filter='fully_trusted')
          PY
          (cd source/desktop && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Retry only actual Windows ABI/component assembly with UTF8 locale
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,subprocess,hashlib,json,os
          root=pathlib.Path.cwd();s=root/'source';raw=s/'build/bootstrap-js';binary=raw/'backplane-serve.exe';before=hashlib.sha256(binary.read_bytes()).hexdigest()
          assert subprocess.check_output(['git','-C',str(s),'rev-parse','HEAD'],text=True).strip()=='74d943b7db3ceab37893b350308cf1802f38fe6b'
          assert subprocess.check_output(['git','-C',str(s),'rev-parse','HEAD^{tree}'],text=True).strip()=='a9231b10c14aeb0af2306dd7ee022922802d6e53'
          run=lambda *args:subprocess.run(list(map(str,args)),check=True)
          run('python',s/'scripts/service-runtime.py','--windows-runtime',root/'inputs/runtime','--source-root',s,'--build',raw,'--producer',s/'scripts/service-release.py','--producer-sha256','6dff1255e45b84df922e37ae984f9655583f1c0e6deac74cc2a5b5f9af654568','--out',s/'build/bootstrap-service')
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==before
          out=root/'package';out.mkdir();service=s/'build/bootstrap-service/component/SERVICE.json';payload=service.parent/'payload'
          run('node',s/'desktop/restore-modes.cjs',service,payload)
          run('python',s/'desktop/freeze-target.py',s,root/'inputs/components/components',service,out/'freeze')
          run('node',s/'desktop/produce-release.cjs','stage','--request',out/'freeze/stage.request.json','--output',out/'stage')
          (out/'RECOVERY.json').write_text(json.dumps({'sourceCommit':'74d943b7db3ceab37893b350308cf1802f38fe6b','sourceTree':'a9231b10c14aeb0af2306dd7ee022922802d6e53','originalBuildRun':40748872940,'binarySha256':before,'toolingCommit':os.environ['GITHUB_SHA'],'compilerInvoked':False,'change':'PYTHONUTF8=1 for Windows locale; existing service binary retained; actual native icon branding and stage generation'},indent=2)+'\n')
          PY
      - name: Bounded native Windows desktop smoke with OS sandbox
        shell: bash
        run: node source/desktop/test/release-smoke.cjs --stage "$GITHUB_WORKSPACE/package/stage" --out "$GITHUB_WORKSPACE/package/evidence"
      - name: Strict archive from actual native evidence
        shell: bash
        run: node source/desktop/archive-after-smoke.cjs --stage "$GITHUB_WORKSPACE/package/stage" --evidence "$GITHUB_WORKSPACE/package/evidence" --out "$GITHUB_WORKSPACE/package/acceptance" --dist "$GITHUB_WORKSPACE/package/dist"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows013-recovered-component-and-desktop
          path: |
            source/build/bootstrap-service/
            package/RECOVERY.json
            package/freeze/
            package/evidence/
            package/acceptance/
            package/dist/*.zip
            package/dist/*.sha256
            package/dist/**/DESKTOP.json
            package/dist/**/MANIFEST.json
          retention-days: 14
