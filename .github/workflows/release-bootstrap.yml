name: Frozen0142 configured web archive only
run-name: RC0142 be904 exact configured web package
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recut0142-be904-web-package
  cancel-in-progress: false
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: be904cd4cb21ad6febe17e674918c96945113d07, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: build/workflow, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Bind exact authenticated configured Linux input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/BackplaneWorks/Backplane/actions/artifacts/13380517899 > "$RUNNER_TEMP/input-metadata.json"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["id"]==13380517899 and d["workflow_run"]["id"]==41950676625 and d["name"]=="configured-service-build-linux-x64" and d["digest"]=="sha256:099324156c454e7139d74d294447dbb8c2d7c4392dfa4c748d922a64a44e7096" and d["expired"] is False' "$RUNNER_TEMP/input-metadata.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13380517899'
          run-id: '41950676625'
          github-token: ${{ github.token }}
          path: build/configured-linux
          merge-multiple: true
      - name: Package supplied web; actual kernel control readback and peak
        run: |
          systemd-run --user --scope -q -p MemoryAccounting=yes -p MemoryMax=3700000000 -p MemorySwapMax=0 -- python3 build/workflow/extra/recut951-package/measured_scope.py --receipt "$GITHUB_WORKSPACE/build/web-resources.json" -- python3 build/workflow/extra/recut951-package/package_configured_web.py --source "$GITHUB_WORKSPACE" --build "$GITHUB_WORKSPACE/build/configured-linux" --tools "$RUNNER_TEMP/web-tools" --out "$GITHUB_WORKSPACE/build/web-package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-web-package
          path: |
            build/web-package/
            build/web-resources.json
            ${{ runner.temp }}/input-metadata.json
          include-hidden-files: true
          if-no-files-found: warn
