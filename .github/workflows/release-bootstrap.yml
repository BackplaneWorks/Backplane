name: Authenticated retained 0142 TEST packaging (never publish)
run-name: TEST0142 ${{ inputs.target }} frozen afa967927
on:
  workflow_dispatch:
    inputs:
      ref: {type: string, required: true}
      build_run: {type: string, required: false, default: ''}
      native_run: {type: string, required: false, default: ''}
      input_run: {type: string, required: false, default: ''}
      measurement_run: {type: string, required: false, default: ''}
      target: {type: choice, required: true, options: [windows-x64, linux-x64, linux-arm64, darwin-arm64]}
      runner: {type: string, required: true}
      components_sha256: {type: string, required: true}
      windows_runtime_sha256: {type: string, required: false, default: ''}
permissions: {contents: read, actions: read}
concurrency:
  group: test0142-${{ inputs.ref }}-${{ inputs.target }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BACKPLANE_TELEMETRY: 'off'
  BACKPLANE_TEST_ONLY: '1'
jobs:
  native-package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - name: Preserve product source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref }}', persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: build/test-workflow, persist-credentials: false}
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/download-artifact@v4
        if: inputs.build_run != ''
        with:
          name: test-service-build-${{ inputs.target }}
          path: build/test-service
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.native_run != ''
        with:
          name: TEST-ONLY-package-${{ inputs.target }}
          path: build/resumed-native
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.input_run != ''
        with:
          name: TEST-ONLY-package-${{ inputs.target }}
          path: build/authenticated-inputs
          run-id: ${{ inputs.input_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.measurement_run != ''
        with:
          name: TEST-ONLY-package-${{ inputs.target }}
          path: build/retained-measurement
          run-id: ${{ inputs.measurement_run }}
          github-token: ${{ github.token }}
      - name: Recover missing packaging from authenticated artifacts; no emitter/link/ABI replay
        shell: bash
        env:
          COMP_SHA: ${{ inputs.components_sha256 }}
          WIN_SHA: ${{ inputs.windows_runtime_sha256 }}
          TARGET: ${{ inputs.target }}
          NATIVE_RUN: ${{ inputs.native_run }}
          INPUT_RUN: ${{ inputs.input_run }}
          MEASUREMENT_RUN: ${{ inputs.measurement_run }}
        run: |
          set -euo pipefail
          python build/test-workflow/extra/rc0142-test-only/prepare-tooling.py --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/test-consumers"
          set --
          if [ -n "$NATIVE_RUN" ]; then set -- "$@" --resume-native "$GITHUB_WORKSPACE/build/resumed-native"; fi
          if [ -n "$INPUT_RUN" ]; then set -- "$@" --authenticated-inputs "$GITHUB_WORKSPACE/build/authenticated-inputs"; fi
          if [ -n "$MEASUREMENT_RUN" ]; then set -- "$@" --retained-measurement "$GITHUB_WORKSPACE/build/retained-measurement"; fi
          python build/test-workflow/extra/rc0142-test-only/native-package.py "$@" --source "$GITHUB_WORKSPACE" --tools "$RUNNER_TEMP/test-consumers" --target "$TARGET" --components-sha256 "$COMP_SHA" --windows-sha256 "$WIN_SHA" --out "$GITHUB_WORKSPACE/build/test-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TEST-ONLY-package-${{ inputs.target }}
          include-hidden-files: true
          path: |
            build/test-native/dist/
            build/test-native/RESULT.json
            build/test-native/*.log
            build/test-native/freeze/*.json
            build/test-native/service-component/*.json
            build/test-native/service-component/component/
            build/test-native/service-component/runtime/runtime-evidence/
          if-no-files-found: warn
