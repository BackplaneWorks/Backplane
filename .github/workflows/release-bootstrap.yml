name: Focused native store sync portability
run-name: Store sync ${{ inputs.source_commit }}
on:
  workflow_dispatch:
    inputs:
      source_commit: {type: string, required: true}
      source_tree: {type: string, required: true}
permissions:
  contents: read
concurrency:
  group: store-sync-${{ inputs.source_commit }}
  cancel-in-progress: false
jobs:
  file-sync:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_TREE: ${{ inputs.source_tree }}
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real native file handle, atomic promotion, sync error and log preservation
        shell: bash
        run: |
          python - <<'PY'
          import pathlib,subprocess,json,os,hashlib,time,platform
          root=pathlib.Path.cwd();out=root/'build/file-sync-portability';out.mkdir(parents=True)
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==os.environ['SOURCE_COMMIT'] and git('rev-parse','HEAD^{tree}')==os.environ['SOURCE_TREE']
          assert subprocess.check_output(['bun','--version'],text=True).strip()=='1.4.3'
          files=['src/server/effects/storeio.js','test/tools/store_sync_portability_test.cjs'];before={n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in files}
          start=time.perf_counter();run=subprocess.run(['bun',files[1]],capture_output=True,text=True,timeout=45);wall=time.perf_counter()-start
          (out/'stdout.log').write_text(run.stdout);(out/'stderr.log').write_text(run.stderr)
          assert before=={n:hashlib.sha256((root/n).read_bytes()).hexdigest() for n in files}
          result={'status':'PASS' if run.returncode==0 else 'FAIL','sourceCommit':os.environ['SOURCE_COMMIT'],'sourceTree':os.environ['SOURCE_TREE'],'platform':platform.system(),'architecture':platform.machine(),'bun':'1.4.3','wallSeconds':wall,'exitCode':run.returncode,'sourceFiles':before,'scope':'Real native filehandle and ordered promotion, ASCII/Unicode disposable homes, fatal fsync errors and unchanged authoritative log only; no service/UI/global proof qualification'}
          if run.returncode==0:result['testReport']=json.loads(run.stdout.splitlines()[-1])
          (out/'RESULT.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result));raise SystemExit(run.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: file-sync-portability-${{ runner.os }}
          path: build/file-sync-portability/
          retention-days: 14
