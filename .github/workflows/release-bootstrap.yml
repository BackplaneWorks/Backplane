name: Frozen0142 existing Windows linked service native packaging only
run-name: RC0142 be904 Windows native-only continuation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: recut0142-be904-windows-native-only
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  BACKPLANE_TELEMETRY: 'off'
  NODE_OPTIONS: --max-old-space-size=512
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Preserve frozen source bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: {ref: be904cd4cb21ad6febe17e674918c96945113d07, fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', path: build/workflow, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with: {python-version: '3.12'}
      - name: Fail-closed Windows resource admission before dependency download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          . build/workflow/extra/recut951-package/job.ps1
          [BP927Job]::CapSelf()
          $r=Get-BP927Resources
          $r | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/package-admission.json"
          Assert-BP927Resources $r -AllowExistingPagefile $true
          if($r.jobMemoryLimitBytes -ne 3699998720){throw 'Packaging cap differs'}
      - name: Bind retained linked artifact identity before native-only packaging
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/BackplaneWorks/Backplane/actions/artifacts/13381085855 > "$RUNNER_TEMP/retained-service-artifact.json"
          python -c 'import json,sys;d=json.load(open(sys.argv[1]));assert d["id"]==13381085855 and d["workflow_run"]["id"]==41950650979 and d["name"]=="configured-service-build-windows-x64" and d["digest"]=="sha256:5eb941d615a7b9b8be456aeff06db96e9c10bbb1efbc2018422fc820f7827634" and d["expired"] is False' "$RUNNER_TEMP/retained-service-artifact.json"
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '13381085855'
          run-id: '41950650979'
          github-token: ${{ github.token }}
          path: build/test-service
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: TEST-ONLY-package-windows-x64
          run-id: 41881768723
          github-token: ${{ github.token }}
          path: build/retained
      - name: Windows current source shell/runtime/stage/strict ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/workflow/extra/recut951-package/run_native.ps1 -Source "$env:GITHUB_WORKSPACE" -Tools "$env:RUNNER_TEMP/native-tools" -Retained "$env:GITHUB_WORKSPACE/build/retained" -Out "$env:GITHUB_WORKSPACE/build/native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-desktop-package-windows-x64
          include-hidden-files: true
          path: |
            build/native/
            ${{ runner.temp }}/package-*.json
            ${{ runner.temp }}/package-paging-samples.jsonl
            ${{ runner.temp }}/retained-service-artifact.json
          if-no-files-found: warn
