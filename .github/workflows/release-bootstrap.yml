name: Configured release producer bootstrap (artifact only)

# First producer run: no fictitious prior successful artifact run is required.
# The JS service is emitted and cross-built per target on Linux, with the
# protected inputs baked into a private prelude, onto each target's pinned Bun
# runtime; each target's own runner then checks it and measures its runtime.
# No push/tag trigger, publication, install, runner registration or write token.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Full root-frozen source commit containing these producers
        type: string
        required: true
      targets:
        description: JSON service target list for this artifact-only build
        type: string
        required: false
        default: '["linux-x64","linux-arm64","darwin-x64","darwin-arm64","windows-x64"]'
      runtime_targets:
        description: JSON matching-host runtime include rows for selected service targets
        type: string
        required: false
        default: '[{"target":"linux-x64","runner":"ubuntu-24.04","service":"backplane-serve","version":true},{"target":"linux-arm64","runner":"ubuntu-24.04-arm","service":"backplane-serve","version":true},{"target":"darwin-x64","runner":"macos-15-intel","service":"backplane-serve","version":true},{"target":"darwin-arm64","runner":"macos-15","service":"backplane-serve","version":true},{"target":"windows-x64","runner":"windows-2025","service":"backplane-serve.exe","version":false}]'
      operation:
        type: choice
        options: [js, android, android-signing-info]
        required: true
      packet_url:
        description: Public source-bound input URL; unused for android-signing-info
        type: string
        required: false
        default: ''
      packet_sha256:
        description: Trusted input SHA256; unused for android-signing-info
        type: string
        required: false
        default: ''
      windows_runtime_url:
        description: js, windows-x64 only. The portable Cygwin runtime bundle (.tar.gz of RUNTIME.json, CLOSURE.json and their members); its contents are pinned in service-runtime.py
        type: string
        required: false
        default: ''
      windows_runtime_sha256:
        description: SHA256 of that .tar.gz
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: release-bootstrap-${{ inputs.ref }}-${{ inputs.operation }}
  cancel-in-progress: false

env:
  BACKPLANE_FROZEN_COMMIT: ${{ inputs.ref }}
  BACKPLANE_VERSION: v0.13.0
  BACKPLANE_VERSION_STAMP: '0.13.0'
  BACKPLANE_TELEMETRY_CHANNEL: release
  # Source scanners and receipts must use UTF-8 on Windows too.
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  js:
    if: inputs.operation == 'js'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    # every target cross-builds here: bun links the emitted JS onto the
    # target's own Bun runtime, pinned in scripts/release-bootstrap.py
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check out trusted workflow tools separately from frozen product
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/bootstrap-tools
          persist-credentials: false
      - uses: ./build/bootstrap-tools/.github/actions/setup-bend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Record workflow tools separately; require frozen product source; fetch verified public JS inputs
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          PACKET_URL: ${{ inputs.packet_url }}
          PACKET_SHA: ${{ inputs.packet_sha256 }}
        shell: bash
        run: |
          python3 build/bootstrap-tools/scripts/release-bootstrap.py fetch --source "$BACKPLANE_FROZEN_COMMIT" --operation js --url "$PACKET_URL" --sha256 "$PACKET_SHA" --directory "$RUNNER_TEMP/release-inputs"
      - name: Build the JS service with configured protected release inputs
        shell: bash
        env:
          BACKPLANE_GOOGLE_BAKE: '1'
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_TELEMETRY_BAKE: '1'
          BACKPLANE_TELEMETRY_URL: https://backplaneworks.com/api/v1/events
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
          TARGET: ${{ matrix.target }}
        run: |
          python3 build/bootstrap-tools/scripts/release-bootstrap.py run --source "$BACKPLANE_FROZEN_COMMIT" --operation js --target "$TARGET" --directory "$RUNNER_TEMP/release-inputs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-service-build-${{ matrix.target }}
          path: |
            build/bootstrap-js/
            build/bootstrap-execution.json
          if-no-files-found: warn
          retention-days: 14

  js-runtime:
    if: inputs.operation == 'js'
    needs: js
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runtime_targets) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Keep frozen source bytes as committed
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check out trusted workflow tools separately from frozen product
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/bootstrap-tools
          persist-credentials: false
      # Linux measures with the runner's own python3 (Ubuntu 24.04: 3.12):
      # setup-python puts LD_LIBRARY_PATH in the job's environment, and the
      # measurement refuses an ambient loader override
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: configured-service-build-${{ matrix.target }}
          path: build
      - name: Run the service on its own target
        shell: bash
        continue-on-error: ${{ !matrix.version }}
        env:
          SERVICE: build/bootstrap-js/${{ matrix.service }}
        run: |
          set -euo pipefail
          chmod 755 "$SERVICE"  # artifacts drop file modes
          v=$("$SERVICE" --version)
          echo "$v"
          [ "$v" = "backplane 0.13.0" ]
      - name: Measure matching-host system ABI and assemble genuine service component
        shell: bash
        env:
          WINRT_URL: ${{ inputs.windows_runtime_url }}
          WINRT_SHA: ${{ inputs.windows_runtime_sha256 }}
        run: |
          chmod 755 build/bootstrap-js/${{ matrix.service }}
          py=python; [ "$RUNNER_OS" = Linux ] && py=/usr/bin/python3
          # Windows: the hub's shell (sh, bash, coreutils) ships beside it
          set --
          if [ "${{ matrix.target }}" = windows-x64 ]; then
            [ -n "$WINRT_URL" ] && [ -n "$WINRT_SHA" ] || { echo "windows-x64 needs windows_runtime_url and windows_runtime_sha256"; exit 1; }
            curl -fsSL "$WINRT_URL" -o "$RUNNER_TEMP/winrt.tar.gz"
            echo "$WINRT_SHA  $RUNNER_TEMP/winrt.tar.gz" | sha256sum -c -
            # (Git Bash tar takes "D:..." for a remote host: work relative to the folder)
            mkdir -p "$RUNNER_TEMP/winrt" && (cd "$RUNNER_TEMP" && tar -xzf winrt.tar.gz -C winrt)
            set -- --windows-runtime "$RUNNER_TEMP/winrt"
          fi
          "$py" build/bootstrap-tools/scripts/service-runtime.py "$@" --source-root "$GITHUB_WORKSPACE" --build "$GITHUB_WORKSPACE/build/bootstrap-js" --producer "$GITHUB_WORKSPACE/build/bootstrap-tools/scripts/service-release.py" --producer-sha256 3548e6f076e428dab4c6950b23d6deb06aa39f4a71523db95f78f0fb76245a1f --out "$GITHUB_WORKSPACE/build/bootstrap-service"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-service-${{ matrix.target }}
          path: |
            build/bootstrap-js/
            build/bootstrap-service/
            build/bootstrap-execution.json
          if-no-files-found: warn
          retention-days: 14

  android:
    if: inputs.operation == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check out trusted workflow tools separately from frozen product
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: build/bootstrap-tools
          persist-credentials: false
      - name: Require frozen product source; fetch actual native-owner inputs and qualified bridge
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.sha }}
          PACKET_URL: ${{ inputs.packet_url }}
          PACKET_SHA: ${{ inputs.packet_sha256 }}
        run: |
          python3 build/bootstrap-tools/scripts/release-bootstrap.py fetch --source "$BACKPLANE_FROZEN_COMMIT" --operation android --url "$PACKET_URL" --sha256 "$PACKET_SHA" --directory "$RUNNER_TEMP/release-inputs"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Produce signed Release APK and AAB through the native owner's exact producer
        shell: bash
        env:
          BACKPLANE_ANDROID_KEYSTORE_BASE64: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BACKPLANE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEY_PASSWORD }}
        run: |
          python3 build/bootstrap-tools/scripts/release-bootstrap.py run --source "$BACKPLANE_FROZEN_COMMIT" --operation android --directory "$RUNNER_TEMP/release-inputs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: configured-android-release
          path: |
            build/bootstrap-android/
            build/bootstrap-execution.json
          if-no-files-found: warn
          retention-days: 14

  android-signing-info:
    if: inputs.operation == 'android-signing-info'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export only configured keystore public certificate identity
        shell: bash
        env:
          BACKPLANE_ANDROID_KEYSTORE_BASE64: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BACKPLANE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BACKPLANE_ANDROID_KEY_ALIAS }}
        run: |
          python3 scripts/android-signing-info.py --source "$BACKPLANE_FROZEN_COMMIT" --out "$RUNNER_TEMP/android-public-signer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: android-configured-public-signer
          path: ${{ runner.temp }}/android-public-signer.json
          if-no-files-found: error
          retention-days: 14
