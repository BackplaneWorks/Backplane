name: Issue 927 exact Windows package consumer
# Sole final be904cd4 package consumer; authenticated fixed artifact only.
# Fresh install + canonical ABI precede discovery/manual + real packaged OMP.
# Both standard-user phases share an actual 8 GiB no-breakaway job and the
# explicitly authorized existing pagefile, with measured paging and cleanup.
on:
  push:
    branches: [backplane/verify-kicad-windows-927]
    paths: [.github/workflows/kicad-windows-927-native.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kicad-windows-927-native
  cancel-in-progress: false
jobs:
  standard-user:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Preserve exact committed source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Frozen product JS for canonical native measurement
        uses: actions/checkout@v4
        with:
          ref: be904cd4cb21ad6febe17e674918c96945113d07
          path: build/frozen-source
          persist-credentials: false
          sparse-checkout: src
      - name: Separately pinned merged canonical verifier
        uses: actions/checkout@v4
        with:
          ref: be904cd4cb21ad6febe17e674918c96945113d07
          path: build/canonical-946
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/service-runtime.py
      - name: Download exact producer artifact through authenticated Actions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41956764458'
          artifact-ids: '13383063412'
          merge-multiple: true
          path: build/927-input
      - name: Enforce resource gate, then native standard-user package acceptance
        shell: pwsh
        run: ./extra/kicad-927-consumer/bootstrap.ps1 -ArtifactDirectory '${{ github.workspace }}\build\927-input' -Combined
      - name: Preserve evidence even on failure or resource refusal
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-927-windows-native-evidence
          path: |
            build/kicad-927-native/*.json
            build/kicad-927-native/*.jsonl
            build/kicad-927-native/*.log
            build/kicad-927-native/*.txt
            build/kicad-927-native/phase-*/**/*.json
            build/kicad-927-native/phase-*/**/*.jsonl
            build/kicad-927-native/phase-*/**/*.log
            build/kicad-927-native/phase-*/**/*.txt
            build/kicad-927-native/phase-*/**/*.png
            build/kicad-927-native/phase-*/omp-models.yml
            build/kicad-927-native/phase-*/omp-observer-extension.js
          if-no-files-found: error
          retention-days: 30
