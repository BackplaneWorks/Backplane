name: Issue 927 exact Windows package consumer
# The preceding attempt stopped at wrapper usage exit 64 before either native
# check; this revision fixes argv transport and captures wrapper diagnostics.
# Logon-created wrapper is explicitly admitted to the same 8 GiB job before
# its independent guard; an observed zero job limit remains a hard refusal.
# Query the exact capped ancestor through a query-only duplicated handle,
# rather than relying on Windows' implicit current-job lookup.
# Pass actual non-secret hosted-run metadata across the standard-user logon;
# preserve its real identity/profile rather than inheriting the admin profile.
# Optional diagnostics use a readable exact runtime copy; a probe setup error
# cannot skip the independent canonical ABI and application checks.
# Canonical verifier uses Python UTF-8 mode for exact frozen UTF-8 JS bytes.
on:
  push:
    branches: [backplane/verify-kicad-windows-927]
    paths: [.github/workflows/kicad-windows-927-native.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: kicad-windows-927-native
  cancel-in-progress: false
jobs:
  standard-user:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - name: Preserve exact committed source bytes on Windows
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Frozen product JS for canonical native measurement
        uses: actions/checkout@v4
        with:
          ref: afa9679273206b3e9b1da4c966c9b63fb6f57ab4
          path: build/frozen-source
          persist-credentials: false
          sparse-checkout: src
      - name: Separately pinned merged canonical verifier
        uses: actions/checkout@v4
        with:
          ref: 2823fe4641bbadcb41a6cf49f91fe2c7fbc77978
          path: build/canonical-946
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/service-runtime.py
      - name: Download exact producer artifact through authenticated Actions
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '41886983230'
          artifact-ids: '13352107148'
          merge-multiple: true
          path: build/927-input
      - name: Enforce resource gate, then native standard-user package acceptance
        shell: pwsh
        run: ./extra/kicad-927-consumer/bootstrap.ps1 -ArtifactDirectory '${{ github.workspace }}\build\927-input'
      - name: Preserve evidence even on failure or resource refusal
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kicad-927-windows-native-evidence
          path: |
            build/kicad-927-native/*.json
            build/kicad-927-native/*.jsonl
            build/kicad-927-native/*.log
            build/kicad-927-native/*.txt
            build/kicad-927-native/*.png
            build/kicad-927-native/home-*/kicad-health.json
          if-no-files-found: error
          retention-days: 30
