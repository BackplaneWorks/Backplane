# The Linux E2E suite on a release archive, on a runner of the archive's own architecture. Run by hand only:
#   gh workflow run e2e-linux.yml --ref main [-f archive_run=<dry run id>] [-f target=linux-arm64|linux-x64]
# It installs the archive with install.sh (private prefix, home and port), then runs scripts/e2e-linux.sh --archive: hub rows, the Settings walk, the client rows (a private Xvfb with
# i3 and lavapipe, real X input) and CEF. No phone. summary.md is in the job's artifact; the archive itself is never uploaded.
name: e2e-linux
on:
  workflow_dispatch:
    inputs:
      archive_run:
        description: "release dry run whose archive-<target> is installed"
        default: "42509812215"
      target:
        description: "linux-arm64 (ubuntu-22.04-arm) or linux-x64 (ubuntu-22.04)"
        default: "linux-arm64"
      image:
        description: "run the steps inside this container image (a newer X server), e.g. ubuntu:26.04; empty: on the runner"
        default: ""
      probe_only:
        description: "only the display probe"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  linux:
    name: e2e ${{ inputs.target }}
    runs-on: ${{ inputs.target == 'linux-arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archive-${{ inputs.target }}
          path: arch
          run-id: ${{ inputs.archive_run }}
          github-token: ${{ github.token }}
      - name: tools
        if: ${{ !inputs.image }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb i3 xclip imagemagick python3-pil libxtst6 libx11-6 mesa-vulkan-drivers libvulkan1 libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon-x11-0 libasound2 libxkbcommon0 curl ca-certificates binutils x11-utils x11-apps x11-xserver-utils > /dev/null
          curl -fsSL https://bun.sh/install | bash -s "bun-v$(cat deploy/bun-version)" > /dev/null
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          uname -m; ls arch; ls /usr/share/vulkan/icd.d/
      - name: display probe
        if: ${{ !inputs.image }}
        continue-on-error: true
        run: |
          mkdir pr && tar -xzf "$(ls arch/*.tar.gz | head -1)" -C pr
          test/e2e/xprobe.sh "$PWD/pr" 2>&1 | tee xprobe.txt
          cp /tmp/xprobe-*.png . 2>/dev/null || true
          rm -rf pr
      - name: e2e-linux
        if: ${{ !inputs.image && !inputs.probe_only }}
        run: |
          set -o pipefail
          export E2E_SHORT=1 E2E_SLOW=1
          git config --global user.email e2e@example.invalid; git config --global user.name e2e
          scripts/e2e-linux.sh --archive "$(ls arch/*.tar.gz | head -1)" --no-phone "$RUNNER_TEMP/e2e" 2>&1 | tee e2e.txt
      - name: in a container
        if: ${{ inputs.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/e2e"
          docker run --rm --privileged -v "$PWD:/w" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w /w ${{ inputs.image }} bash test/e2e/ci-container.sh ${{ inputs.probe_only && 'probe' || 'full' }} arch "$RUNNER_TEMP/e2e" 2>&1 | tee e2e.txt
      - name: own the files
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/e2e" . 2>/dev/null; sudo chmod -R u+rX "$RUNNER_TEMP/e2e" 2>/dev/null; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ inputs.target }}
          path: |
            e2e.txt
            xprobe.txt
            xprobe-*.png
            ${{ runner.temp }}/e2e/summary.md
            ${{ runner.temp }}/e2e/results.tsv
            ${{ runner.temp }}/e2e/*.log
            ${{ runner.temp }}/e2e/hub-rows/rows.json
            ${{ runner.temp }}/e2e/hub-rows/**/*.log
            ${{ runner.temp }}/e2e/hub-rows/**/fake*
            ${{ runner.temp }}/e2e/client/rows.json
            ${{ runner.temp }}/e2e/client/shots/*.png
            ${{ runner.temp }}/e2e/cef/*.log
            ${{ runner.temp }}/e2e/cef/*.txt
          retention-days: 3
