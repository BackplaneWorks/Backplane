name: Nightly candidate (build only)

# Future nightly wiring remains available; no tag, public release or pruning
# is performed before root has accepted the candidate's actual package gates.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: Plan immutable nightly candidate
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: identity
        run: |
          set -eu
          stable=$(git tag -l 'v*' | grep -v -- '-' | sort -V | tail -n1 || true)
          ver=${stable#v}
          ver=${ver:-0.0.0}
          maj=${ver%%.*}; rest=${ver#*.}; min=${rest%%.*}; pat=${rest#*.}
          base="v$maj.$min.$((pat + 1))"
          day=$(date -u +%Y%m%d)
          # Build-only candidates have no tags to count. Reserve a unique numeric
          # suffix per actual run/attempt, including retries of the same source.
          [ "$GITHUB_RUN_ATTEMPT" -lt 1000 ]
          n=$(( GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT ))
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$base-nightly.$day.$n" >> "$GITHUB_OUTPUT"

  candidate:
    name: Build nightly candidate only
    needs: [plan]
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}
      version: ${{ needs.plan.outputs.version }}
      telemetry_url: https://backplane.works/api/v1/events
    secrets: inherit
