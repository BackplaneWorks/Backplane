name: nightly
# A nightly build of main: release.yml's build, signing and manifest, tagged vX.Y.Z-nightly.YYYYMMDD.N and published as a prerelease of this repo, its
# signed files named nightly-manifest.json* so 0.15.0-0.15.3's beta hubs never offer it (docs/nightly.md). Z is one past the newest vX.Y.Z tag or
# release/X.Y.Z branch (a release being cut counts). Nothing is built when main has not moved since the last nightly; the newest 14 are kept.
# The update check on a clean Boat (scripts/nightly-update-gate.sh) runs from the person's machine after it (scripts/bare-gate-nightly.sh, 03:30).
on:
  # off the hour (GitHub drops scheduled runs under load, most at :00: 2026-11-14's 09:00 never started), and a second try later: it builds nothing
  # when the first already built this main (plan: go=false), and the concurrency group keeps them from overlapping
  schedule:
    - cron: '23 8 * * *'    # 08:23 UTC: 00:23 Pacific, done before the 03:30 check
    - cron: '41 11 * * *'   # 11:41 UTC: the second try
  workflow_dispatch:
    inputs:
      force:
        description: Build even when main has not moved since the last nightly
        type: boolean
        default: false
concurrency:
  group: nightly
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && '1' || '' }}
        run: |
          set -eu
          # the newest version taken: a vX.Y.Z tag, or a release/X.Y.Z branch (a release being cut)
          top=$(git ls-remote --tags --heads "https://github.com/$GITHUB_REPOSITORY" | awk '{print $2}' | sed -nE 's#^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$#\1#p; s#^refs/heads/release/([0-9]+\.[0-9]+\.[0-9]+)$#\1#p' | sort -V | tail -1)
          [ -n "$top" ] || { echo "::error::no vX.Y.Z tag"; exit 1; }
          next="v${top%.*}.$(( ${top##*.} + 1 ))"
          day=$(date -u +%Y%m%d)
          list=$(gh release list -R "$GITHUB_REPOSITORY" --limit 60 --json tagName -q '.[].tagName')
          last=$(printf '%s\n' "$list" | grep -E -- '-nightly\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          n=$(printf '%s\n' "$list" | grep -c -- "^$next-nightly\.$day\." || true)
          tag="$next-nightly.$day.$((n + 1))"
          go=true
          if [ -n "$last" ] && [ -z "$FORCE" ]; then
            was=$(gh release view "$last" -R "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish || true)
            if [ "$was" = "$GITHUB_SHA" ]; then go=false; echo "main is still at ${GITHUB_SHA:0:10}, the last nightly ($last): nothing to build"; fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"; echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "nightly $tag of ${GITHUB_SHA:0:10} (newest version taken: $top; last nightly: ${last:-none}; go: $go)"
  release:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
      nightly: true
    secrets: inherit
    permissions:
      contents: write
      actions: read
  prune:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # the newest 14 stay: a hub that updated last week still finds its build listed (and the update check its "from"). Only nightly tags, never a release's.
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName' | grep -E -- '^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+\.[0-9]+$' | sort -V -r | tail -n +15 |
            while read -r t; do gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "pruned $t"; done
