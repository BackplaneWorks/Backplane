name: Nightly

# The whole gate on main, once a day: ci.yml's jobs (type-check, the proof,
# the full test suite in four shards, the hub cross-built for every target
# and smoke-tested on its own OS, the desktop and release-producer guards).
# The merge gate (scripts/local-ci.py) runs only scripts/fast-tests.txt, so
# this is what keeps the rest of the suite from rotting. Each hub build is
# kept as the run's `backplane-serve-js` artifact for 7 days.
#
# It tags and publishes nothing: release.yml is the release lead's frozen
# artifact collector (one stable tag, root-chosen producer runs) and cannot
# be called from here. It used to be, and every nightly from 2026-10-22 on
# died at startup (release.yml asks for `actions: read`, which this
# workflow did not grant, and its inputs can never match a nightly).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  ci:
    name: Full CI on main
    uses: ./.github/workflows/ci.yml
