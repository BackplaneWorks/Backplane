name: Existing AppImage wrapper native launch (evidence only)
on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [linux-x64, linux-arm64]
        required: true
      appimage_url:
        required: true
      appimage_sha256:
        required: true
      stage_url:
        required: true
      stage_sha256:
        required: true
      tools_url:
        required: true
      tools_sha256:
        required: true
      fixture_sha256:
        required: true
permissions:
  contents: read
concurrency:
  group: appimage-smoke-${{ inputs.target }}-${{ inputs.appimage_sha256 }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ${{ inputs.target == 'linux-x64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target }}
      APPIMAGE_URL: ${{ inputs.appimage_url }}
      APPIMAGE_SHA: ${{ inputs.appimage_sha256 }}
      STAGE_URL: ${{ inputs.stage_url }}
      STAGE_SHA: ${{ inputs.stage_sha256 }}
      TOOLS_URL: ${{ inputs.tools_url }}
      TOOLS_SHA: ${{ inputs.tools_sha256 }}
      FIXTURE_SHA: ${{ inputs.fixture_sha256 }}
      W: ${{ github.workspace }}/appimage-smoke
      BACKPLANE_TELEMETRY: 'off'
      BACKPLANE_DESKTOP_BROWSER: '1'
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact retained wrapper, accepted stage and fixture
        shell: bash
        run: |
          set -euo pipefail
          for v in "$APPIMAGE_SHA" "$STAGE_SHA" "$TOOLS_SHA" "$FIXTURE_SHA"; do [[ $v =~ ^[0-9a-f]{64}$ ]] || exit 2; done
          for u in "$APPIMAGE_URL" "$STAGE_URL" "$TOOLS_URL"; do [[ $u =~ ^https:// ]] || exit 2; done
          mkdir -p "$W"
          cd "$W"
          curl --proto '=https' --tlsv1.2 -fsSL "$APPIMAGE_URL" -o Backplane.AppImage
          echo "$APPIMAGE_SHA  Backplane.AppImage" | sha256sum -c -
          chmod 755 Backplane.AppImage
          curl --proto '=https' --tlsv1.2 -fsSL "$STAGE_URL" -o stage.tar.gz
          echo "$STAGE_SHA  stage.tar.gz" | sha256sum -c -
          curl --proto '=https' --tlsv1.2 -fsSL "$TOOLS_URL" -o tools.tar.gz
          echo "$TOOLS_SHA  tools.tar.gz" | sha256sum -c -
          tar -xpzf stage.tar.gz
          tar -xpzf tools.tar.gz
          echo "$FIXTURE_SHA  tools/desktop/test/appimage-smoke.cjs" | sha256sum -c -
          python3 -c 'import json,sys; s=json.load(open("stage/STAGE.json")); assert s["target"]==sys.argv[1]; assert s["release"]["version"]=="0.14.0"' "$TARGET"
          (cd tools/desktop && npm ci --ignore-scripts --no-audit --no-fund)
      - name: Existing ephemeral-host sandbox setup for exact owned app paths
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          app="$W/stage/runtime/backplane-desktop"
          wrapper="$W/evidence-$TARGET/wrapper-tmp/**/usr/lib/backplane/runtime/backplane-desktop"
          [[ $app =~ ^/[-A-Za-z0-9_/.]+$ ]]
          # Same scoped userns allowance as desktop-smoke, including only the
          # actual AppImage child path under this test's owned temporary root.
          printf 'abi <abi/4.0>,\nprofile backplane-appimage-stage %s flags=(unconfined) {\n  userns,\n}\nprofile backplane-appimage-runtime %s flags=(unconfined) {\n  userns,\n}\nprofile backplane-appimage-probe /usr/bin/unshare flags=(unconfined) {\n  userns,\n}\n' "$app" "$wrapper" > "$RUNNER_TEMP/backplane-appimage-userns.profile"
          sudo apparmor_parser --replace "$RUNNER_TEMP/backplane-appimage-userns.profile"
          unshare --user --map-root-user /bin/true
          sudo apt-get install -y -q xvfb >/dev/null
      - name: Launch the exact AppImage command on its native architecture
        shell: bash
        run: |
          set -euo pipefail
          cd "$W"
          xvfb-run --auto-servernum --server-args='-screen 0 1280x900x24 -nolisten tcp' node tools/desktop/test/appimage-smoke.cjs --stage "$W/stage" --out "$W/evidence-$TARGET" --appimage "$W/Backplane.AppImage" --appimage-sha256 "$APPIMAGE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-wrapper-smoke-${{ inputs.target }}
          path: |
            appimage-smoke/evidence-${{ inputs.target }}/
            !appimage-smoke/evidence-${{ inputs.target }}/wrapper-tmp/**
          if-no-files-found: warn
          retention-days: 30
