# Backplane order server: TLS in front of the app on 127.0.0.1:8090.
# HOST is the server's name or address (deploy.sh fills it in).
limit_req_zone $binary_remote_addr zone=fab_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=fab_up:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=fab_conn:10m;

# no query strings in the log: they can carry a quote's token
log_format fab '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/fab.log fab;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/fab/tls/fullchain.pem;
    ssl_certificate_key /etc/fab/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:fab_tls:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    access_log /var/log/nginx/fab.log fab;

    client_max_body_size 52m;
    client_body_timeout 60s;
    limit_conn fab_conn 20;

    location = /v1/quotes {
        limit_req zone=fab_up burst=4 nodelay;
        proxy_request_buffering on;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        limit_req zone=fab_api burst=40 nodelay;
        client_max_body_size 256k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
