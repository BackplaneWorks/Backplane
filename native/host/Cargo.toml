[package]
name = "bphost"
version = "0.0.1"
edition = "2021"
description = "Backplane effects-host spike: sockets + SQLite in Rust, policy in native Bend (child process)"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
