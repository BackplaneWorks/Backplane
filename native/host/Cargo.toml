[package]
name = "backplane-hub"
version = "0.15.0"
edition = "2021"
publish = false
description = "Backplane hub in Rust. Native clients only (GPUI desktop, iOS, Android); renderer mobile; no helper process, no JS, no ."

[[bin]]
name = "backplane-hub"
path = "src/main.rs"

[features]
# test/update only: trust one more update key, read at run time (update/rel.rs). Never in a release: release.yml refuses a binary carrying it.
e2e-trust = []

[dependencies]
anyhow = "1"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
ed25519-compact = { path = "vendor/ed25519-compact", default-features = false }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "net", "io-util", "sync", "time", "process", "macros", "fs"] }
tokio-tungstenite = "0.24"
prost = "0.14"
prost-reflect = "0.16"
rayon = "1"
i_triangle = "0.51"
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
zip = { version = "2.6.1", default-features = false, features = ["deflate-flate2", "flate2"] } # Windows' KiCad zip, unpacked in-process (flate2: its pure-Rust miniz backend)
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] } # the zip's inflate: miniz_oxide, no C

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Time", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"

# Test builds (cargo test uses dev): line tables for panic backtraces, none for dependencies; less to compile and link on every edit.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
