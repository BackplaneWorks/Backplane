[package]
name = "backplane-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
futures-util = { version = "0.3", features = ["sink"] }
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
unicode-segmentation = "1"

[profile.release]
opt-level = "s"
strip = "symbols"
debug = 0
lto = false
codegen-units = 8
