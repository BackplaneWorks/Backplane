[package]
name = "backplane-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
env_logger = { version = "0.11", default-features = false }
lyon = { version = "1", default-features = false }
image = { version = "0.25.1", default-features = false, features = ["jpeg"] }
ureq = { version = "2", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false }
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.release]
opt-level = "s"
strip = "symbols"
debug = 0
lto = "fat"
panic = "abort"
codegen-units = 1

# Quick builds for test and dev cuts: cargo build --profile fast. Releases keep fat LTO.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"
