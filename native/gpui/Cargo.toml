[package]
name = "backplane-gpui"
version = "0.15.0"
edition = "2024"
publish = false
default-run = "backplane-gpui"

[[bin]]
name = "backplane-gpui"
path = "src/main.rs"

# the embedded Chromium's helper processes on macOS (src/bin/backplane-cef-helper.rs, scripts/cef-mac-helpers.sh)
[[bin]]
name = "backplane-cef-helper"
path = "src/bin/backplane-cef-helper.rs"
required-features = ["cef"]

[features]
default = []
# Embedded Chromium (OSR) in the Browser tab; needs libcef.so at run time (see docs/browser-cef.md). Off: the hub-frame JPEG poller.
cef = ["dep:cef"]

[dependencies]
cef = { version = "=154.5.0", default-features = false, optional = true }
# the client window's native handle, the parent of the Browser tab's windowed Chromium (viewers/cef_native.rs); the version gpui implements
raw-window-handle = "0.6"
anyhow = "1"
log = "0.4"
async-channel = "2"
env_logger = { version = "0.11", default-features = false }
lyon = { version = "1", default-features = false }
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
ureq = { version = "2", default-features = false }
futures-util = { version = "0.3", features = ["sink"] }
serde_json = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-native-certs = "0.8"
unicode-segmentation = "1"
# a document's SVG pictures (README badges) drawn here, sharp and in their own colours: the version and features gpui already builds
resvg = { version = "0.45.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", default-features = false, features = ["shape", "xfixes"] }
gpui = { version = "=0.2.2", default-features = false, features = ["x11"] }
# The 3D page's own GPU context (viewers/solid_gpu.rs): the versions gpui already builds on Linux.
blade-graphics = "0.7.0"
blade-macros = "0.3.0"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

# Windows: DirectX 11 and DirectWrite. A release build compiles gpui's HLSL shaders with fxc.exe (Windows SDK) on a Windows build host;
# a debug build compiles them when the window opens (D3DCompile). The manifest (DPI awareness, common controls) needs the SDK's rc.exe.
[target.'cfg(target_os = "windows")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Authorization", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }
# gpui 0.2.2 with one change in build.rs: a Windows client cross-built on Linux embeds the shader bytes fxc made on Windows (vendor/gpui/PATCH.md)
gpui = { path = "vendor/gpui" }

[profile.release]
opt-level = "s"
strip = "symbols"
debug = 0
lto = "fat"
panic = "abort"
codegen-units = 1

# Quick builds for test and dev cuts: cargo build --profile fast. Releases keep fat LTO.
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = "none"

# Test builds (cargo test uses dev): line tables for panic backtraces, none for dependencies; less to compile and link on every edit.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
