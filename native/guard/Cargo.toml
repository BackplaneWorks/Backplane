[package]
name = "backplane-guard"
version = "0.16.0"
edition = "2021"
publish = false
description = "`backplane`: keeps a Backplane hub running and restarts it on Windows, Linux and macOS. Shares no code with the hub, so a broken hub build cannot break its own recovery."

[[bin]]
name = "backplane"
path = "src/main.rs"

[features]
# test/update only: also trust the E2E's fresh key for releases below 0.1.0 (the hub's update::rel, compiled in for `builds keep`). Release builds refuse it (release.yml).
e2e-trust = []

[dependencies]
serde_json = "1"
sha2 = "0.10"
# `backplane builds keep` runs the hub's updater (update::rel, update::run), whose signature check, encodings and hashes these are
ed25519-compact = { path = "../host/vendor/ed25519-compact", default-features = false }
base64 = "0.22"
hex = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
# the Windows icon and VERSIONINFO resources (build.rs, native/winres.rs)
embed-resource = "3.0"

[profile.release]
opt-level = 2
strip = true
panic = "unwind"

[profile.fast]
inherits = "release"
incremental = true
