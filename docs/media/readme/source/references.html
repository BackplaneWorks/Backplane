<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Backplane reference menus</title>
<style>
  html,body{margin:0;background:#0c0e10}
  #references{width:1608px;display:grid;gap:16px}
  .menu{position:relative;overflow:hidden;height:var(--height)}
  img{position:absolute;width:1608px;left:0;top:var(--top);max-width:none}
</style>
<!-- Lossless crops of actual 200% screenshots, stacked without recreating UI. -->
<div id="references">
  <div class="menu" style="--height:200px;--top:-16px"><img src="../features/reference-thread-2x.png" alt="Thread reference menu"></div>
  <div class="menu" style="--height:88px;--top:-128px"><img src="../features/reference-room-2x.png" alt="Room reference menu"></div>
  <div class="menu" style="--height:144px;--top:-72px"><img src="../features/reference-project-2x.png" alt="Project reference menu"></div>
  <div class="menu" style="--height:88px;--top:-128px"><img src="../features/reference-bot-2x.png" alt="Bot reference menu"></div>
</div>
