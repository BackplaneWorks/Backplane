<!doctype html><meta charset=utf-8><title>bp-index</title>
<style>body{margin:0;height:6000px;background:#fff;font:20px sans-serif}
#inp{position:fixed;left:0;top:0;width:100%;height:30vh;font-size:28px;box-sizing:border-box;background:#eef}
#next{position:fixed;left:0;top:40vh;width:100%;height:20vh;display:block;background:#2a7;color:#fff;font-size:28px}</style>
<input id=inp placeholder="type here"><a id=next href="page2.html">next page</a>
<script>
let typed='';
inp.oninput=()=>{typed=inp.value; document.title='typed:'+typed};
addEventListener('scroll',()=>{if(scrollY>0) document.title='scrolled:'+(typed||'-')},{passive:true});
</script>
